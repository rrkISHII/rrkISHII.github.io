    <!-- Google Maps Style Draggable Bottom Sheet CSS -->
    <style>
        /* Bottom Sheet Backdrop Overlay */
        .bottom-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .bottom-sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Bottom Sheet Container */
        .bottom-sheet {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 85vh;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 25px rgba(0,0,0,0.25);
            z-index: 2001;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            touch-action: none; /* Prevents default scroll interference during drag */
            user-select: none;
        }

        /* Snapping states */
        .bottom-sheet.peek {
            transform: translateY(calc(100% - 220px));
        }
        .bottom-sheet.expanded {
            transform: translateY(0%);
        }
        .bottom-sheet.dragging {
            transition: none; /* Disable transition during direct finger drag */
        }

        /* Dark Theme Support for Bottom Sheet */
        body.dark-theme .bottom-sheet {
            background: #1e1e1e;
            color: #ffffff;
        }

        /* Drag Handle Header Area */
        .sheet-drag-area {
            width: 100%;
            padding: 12px 20px 8px 20px;
            cursor: grab;
            box-sizing: border-box;
            background: inherit;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .sheet-handle {
            width: 44px;
            height: 5px;
            background: #ccc;
            border-radius: 3px;
            margin: 0 auto 10px auto;
        }
        body.dark-theme .sheet-handle {
            background: #555;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .sheet-header h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
        }
        .sheet-close-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: #666;
            padding: 4px;
        }
        body.dark-theme .sheet-close-btn {
            color: #ccc;
        }

        /* Prominent Top Button */
        .destination-btn {
            width: 100%;
            padding: 14px;
            background-color: #0B793D;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 3px 8px rgba(11, 121, 61, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .destination-btn:active {
            transform: scale(0.98);
        }
        .destination-btn:hover {
            background-color: #085d2e;
        }

        /* Scrollable Content Body */
        .sheet-content {
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            flex: 1;
            touch-action: pan-y;
        }

        /* Image Placeholder / Container */
        .sheet-image-container {
            width: 100%;
            height: 160px;
            background-color: #e0e0e0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 0.95rem;
            margin: 15px 0;
            border: 2px dashed #b0b0b0;
            overflow: hidden;
            position: relative;
        }
        .sheet-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        body.dark-theme .sheet-image-container {
            background-color: #2a2a2a;
            border-color: #444;
            color: #aaa;
        }

        .sheet-description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #444;
            margin: 0;
        }
        body.dark-theme .sheet-description {
            color: #ddd;
        }
    </style>
</head>

    <!-- Google Maps Style Swipeable Bottom Sheet -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <!-- Drag Handle Area -->
        <div class="sheet-drag-area" id="sheetDragArea">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet Rotate Plugin JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.umd.min.js"></script>

    <!-- JavaScript Logic -->
    <script>
        // Initialize Map with Rotation Support & Compass hidden at 0° bearing
        var oc_map = L.map('oc_map', {
            zoomControl: false,
            rotate: true,                 
            touchRotate: true,         
            shiftKeyRotate: true,      
            dragRotate: true,          
            bounceAtZoom: false,
            touchZoom: 'center',
            rotateControl: {
                position: 'topright',
                closeOnZeroBearing: true // Compass hides when pointing North (0°), appears when rotated
            }
        }).setView([14.4788, 120.9964], 18);

        if (oc_map.touchRotate) {
            oc_map.touchRotate.enable();
        }

        document.getElementById('oc_map').addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        // Map Tile Layers
        var osm_map = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        var dark_map = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
        });

        osm_map.addTo(oc_map);
        var currentTileLayer = osm_map;
        var searchMarker = null;
        let userMarker = null;
        let accuracyCircle = null;

        // --- Swipeable Google Maps Style Bottom Sheet Logic ---
        const bottomSheet = document.getElementById('bottomSheet');
        const bottomSheetOverlay = document.getElementById('bottomSheetOverlay');
        const closeBottomSheetBtn = document.getElementById('closeBottomSheetBtn');
        const sheetDragArea = document.getElementById('sheetDragArea');
        const sheetContent = document.getElementById('sheetContent');
        const goToDestinationBtn = document.getElementById('goToDestinationBtn');
        const sheetTitle = document.getElementById('sheetTitle');
        const sheetDescription = document.getElementById('sheetDescription');
        const sheetImage = document.getElementById('sheetImage');
        const sheetPlaceholderText = document.getElementById('sheetPlaceholderText');

        let activeDestinationCoords = null;
        let currentSnapState = 'closed'; // 'closed', 'peek', 'expanded'
        let startY = 0;
        let currentY = 0;
        let initialTransformY = 0;
        let isDragging = false;

        // Open bottom sheet in peek state
        function openBottomSheet(data) {
            sheetTitle.textContent = data.title || "Location Details";
            sheetDescription.textContent = data.description || "No description available.";
            activeDestinationCoords = data.coords || null;

            if (data.imageUrl) {
                sheetImage.src = data.imageUrl;
                sheetImage.style.display = "block";
                sheetPlaceholderText.style.display = "none";
            } else {
                sheetImage.src = "";
                sheetImage.style.display = "none";
                sheetPlaceholderText.style.display = "flex";
            }

            snapToState('peek');
        }

        // Close bottom sheet completely
        function closeBottomSheet() {
            snapToState('closed');
        }

        function getPeekOffsetY() {
            const sheetHeight = bottomSheet.offsetHeight;
            return sheetHeight - 220; // Leaves 220px visible at the bottom
        }

        function snapToState(state) {
            currentSnapState = state;
            bottomSheet.classList.remove('dragging', 'peek', 'expanded');
            bottomSheet.style.transform = '';

            if (state === 'expanded') {
                bottomSheet.classList.add('expanded');
                bottomSheetOverlay.classList.add('active');
            } else if (state === 'peek') {
                bottomSheet.classList.add('peek');
                bottomSheetOverlay.classList.remove('active'); // Keep background map interactive in peek mode
            } else { // 'closed'
                bottomSheetOverlay.classList.remove('active');
            }
        }

        // --- Touch Event Handlers for Dragging/Swiping ---
        function onTouchStart(e) {
            // If dragging top header area OR if inner content is scrolled to top
            if (e.target.closest('#sheetDragArea') || sheetContent.scrollTop === 0) {
                isDragging = true;
                startY = e.touches[0].clientY;
                
                // Get current Y offset pixels
                const sheetHeight = bottomSheet.offsetHeight;
                if (currentSnapState === 'expanded') {
                    initialTransformY = 0;
                } else if (currentSnapState === 'peek') {
                    initialTransformY = getPeekOffsetY();
                }

                bottomSheet.classList.add('dragging');
            }
        }

        function onTouchMove(e) {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            let newTransformY = initialTransformY + deltaY;

            // Prevent dragging higher than expanded height
            if (newTransformY < 0) newTransformY = 0;

            bottomSheet.style.transform = `translateY(${newTransformY}px)`;
        }

        function onTouchEnd(e) {
            if (!isDragging) return;
            isDragging = false;

            const deltaY = currentY - startY;
            const sheetHeight = bottomSheet.offsetHeight;
            const peekOffset = getPeekOffsetY();

            // Check swipe gestures & snap positions
            if (Math.abs(deltaY) > 50) {
                if (deltaY < 0) { // Swiped UP
                    if (currentSnapState === 'peek') snapToState('expanded');
                    else snapToState('expanded');
                } else { // Swiped DOWN
                    if (currentSnapState === 'expanded') snapToState('peek');
                    else if (currentSnapState === 'peek') snapToState('closed');
                }
            } else { // Snap to nearest boundary based on current dragged position
                const currentPx = initialTransformY + deltaY;
                if (currentPx < peekOffset / 2) {
                    snapToState('expanded');
                } else if (currentPx < peekOffset + 100) {
                    snapToState('peek');
                } else {
                    snapToState('closed');
                }
            }
        }

        // Attach Touch Listeners
        bottomSheet.addEventListener('touchstart', onTouchStart, { passive: true });
        bottomSheet.addEventListener('touchmove', onTouchMove, { passive: true });
        bottomSheet.addEventListener('touchend', onTouchEnd);

        closeBottomSheetBtn.addEventListener('click', closeBottomSheet);
        bottomSheetOverlay.addEventListener('click', closeBottomSheet);

        goToDestinationBtn.addEventListener('click', () => {
            if (activeDestinationCoords) {
                alert(`Routing to: Lat ${activeDestinationCoords.lat}, Lng ${activeDestinationCoords.lng}`);
            } else {
                alert("Go to destination clicked!");
            }
        });

        // --- GeoJSON Integration with Custom Icons & Dynamic Bottom Sheet ---
        const geojsonData = {
          "type": "FeatureCollection",
          "features": [
            {
              "type": "Feature",
              "properties": { "Parking": "oc_p" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9960298353447, 14.48005373642276], [120.99639067130431, 14.479904084778568], [120.99632770189737, 14.479761747116711], [120.99596686593765, 14.479911398856117], [120.9960298353447, 14.48005373642276]]]
              }
            },
            {
              "type": "Feature",
              "properties": {},
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9963976, 14.4798917], [120.9963976, 14.4798917], [120.9963976, 14.4798917], [120.9963976, 14.4798917]]]
              }
            },
            {
              "type": "Feature",
              "properties": { "Parking": "oc_adl" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9963991, 14.4798929], [120.9964693, 14.4798555], [120.9963799, 14.4796655], [120.9964613, 14.4796286], [120.9963675, 14.4794116], [120.9962702, 14.4794565], [120.9960449, 14.4790056], [120.9959671, 14.4790414], [120.9962137, 14.479515], [120.9963991, 14.4798929]]]
              }
            },
            {
              "type": "Feature",
              "properties": { "Parking": "oc_ibed" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9956077, 14.4793286], [120.9959688, 14.4791641], [120.9958783, 14.4789572], [120.9955126, 14.47913], [120.9955587, 14.4792243], [120.9956077, 14.4793286]]]
              }
            },
            {
              "type": "Feature",
              "properties": { "Parking": "oc_coli" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.995496, 14.4790281], [120.9958371, 14.4788783], [120.9955838, 14.4783617], [120.995253, 14.4785205], [120.9953714, 14.4787622], [120.995496, 14.4790281]]]
              }
            },
            {
              "type": "Feature",
              "properties": { "Parking": "oc_pool" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9952389, 14.4785205], [120.9955733, 14.4783617], [120.9954143, 14.4780036], [120.9950667, 14.478156], [120.9952389, 14.4785205]]]
              }
            },
            {
              "type": "Feature",
              "properties": { "DPRO": "oc_dpro" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9958657, 14.4788702], [120.9961473, 14.47874], [120.995777, 14.4779814], [120.9955143, 14.4781243], [120.9957281, 14.4785667], [120.9958657, 14.4788702]]]
              }
            },
            {
              "type": "Feature",
              "properties": { "Parking": "oc_elo" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9962694, 14.4789706], [120.9969287, 14.478671], [120.9968809, 14.478589], [120.9962308, 14.4789001], [120.9962694, 14.4789706]]]
              }
            },
            {
              "type": "Feature",
              "properties": { "gym": "oc_gym" },
              "geometry": {
                "type": "Polygon",
                "coordinates": [[[120.9962232, 14.478811], [120.9961131, 14.4785945], [120.9966402, 14.4783521], [120.9967478, 14.47857], [120.9965637, 14.4786508], [120.9962232, 14.478811]]]
              }
            }
          ]
        };

        L.geoJSON(geojsonData, {
            style: function (feature) {
                if (feature.properties.DPRO) {
                    return { color: "#d9534f", weight: 1.5, fillColor: "#d9534f", fillOpacity: 0.25 };
                } else if (feature.properties.gym) {
                    return { color: "#ff7800", weight: 1, fillColor: "#ff7800", fillOpacity: 0.2 };
                }
                return { color: "#0B793D", weight: 1, fillColor: "#0B793D", fillOpacity: 0.2 };
            },
            onEachFeature: function (feature, layer) {
                let isDpro = feature.properties.DPRO === "oc_dpro";
                let center = null;

                try {
                    center = layer.getBounds().getCenter();
                } catch (e) {
                    console.warn("Invalid bounds for feature.");
                }

                // DPRO Click Event Handler
                const handleDproClick = () => {
                    openBottomSheet({
                        title: "DPRO Building",
                        description: "Dr. Pablo R. Olivarez",
                        imageUrl: "",
                        coords: center
                    });
                };

                if (isDpro) {
                    layer.on('click', handleDproClick);
                } else {
                    let popupText = "<b>Feature</b>";
                    if (feature.properties.Parking) {
                        popupText = `<b>Parking Area:</b> ${feature.properties.Parking}`;
                    } else if (feature.properties.gym) {
                        popupText = `<b>Facility:</b> Gym (${feature.properties.gym})`;
                    }
                    layer.bindPopup(popupText);
                }

                // Place marker icon on center of polygon
                if (center) {
                    let iconClass = "fa-solid fa-map-pin";
                    let iconColor = "#3388ff";
                    
                    if (isDpro) {
                        iconClass = "fa-solid fa-building-shield";
                        iconColor = "#d9534f";
                    } else if (feature.properties.gym) {
                        iconClass = "fa-solid fa-dumbbell";
                        iconColor = "#ff7800";
                    } else if (feature.properties.Parking) {
                        iconClass = "fa-solid fa-square-parking";
                        iconColor = "#0B793D";
                    }

                    const customIcon = L.divIcon({
                        className: 'custom-map-icon',
                        html: `<div style="background-color: white; padding: 6px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); text-align: center; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;">
                                   <i class="${iconClass}" style="color: ${iconColor}; font-size: 14px;"></i>
                               </div>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const marker = L.marker(center, { icon: customIcon }).addTo(oc_map);

                    if (isDpro) {
                        marker.on('click', handleDproClick);
                    } else {
                        marker.bindPopup(layer.getPopup());
                    }
                }
            }
        }).addTo(oc_map);
        // ----------------------------------------------------

        // Drawer Menu Toggle
        const menuToggle = document.getElementById('menuToggle');
        const closeDrawer = document.getElementById('closeDrawer');
        const sideDrawer = document.getElementById('sideDrawer');
        const navOverlay = document.getElementById('navOverlay');

        function openMenu() {
            sideDrawer.classList.add('active');
            navOverlay.classList.add('active');
        }

        function closeMenu() {
            sideDrawer.classList.remove('active');
            navOverlay.classList.remove('active');
        }

        menuToggle.addEventListener('click', openMenu);
        closeDrawer.addEventListener('click', closeMenu);
        navOverlay.addEventListener('click', closeMenu);

        // Modal Controls
        const feedbackLink = document.getElementById('feedbackLink');
        const feedbackModal = document.getElementById('feedbackModal');
        const closeFeedbackBtn = document.getElementById('closeFeedbackBtn');
        const sendFeedbackBtn = document.getElementById('sendFeedbackBtn');
        const feedbackForm = document.getElementById('feedbackForm');
        const successModal = document.getElementById('successModal');
        const closeSuccessBtn = document.getElementById('closeSuccessBtn');

        feedbackLink.addEventListener('click', (e) => {
            e.preventDefault();
            closeMenu();
            feedbackModal.classList.add('active');
        });

        closeFeedbackBtn.addEventListener('click', () => {
            feedbackModal.classList.remove('active');
        });

        // EmailJS Submission
        feedbackForm.addEventListener('submit', (e) => {
            e.preventDefault();

            sendFeedbackBtn.disabled = true;
            sendFeedbackBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Sending...`;

            const email = document.getElementById('userEmail').value;
            const subject = document.getElementById('feedbackSubject').value;
            const message = document.getElementById('feedbackMessage').value;

            const templateParams = {
                name: email,
                email: email,
                subject: subject,
                message: message
            };

            emailjs.send('service_wdyvki8', 'template_86k881g', templateParams)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                    feedbackModal.classList.remove('active');
                    successModal.classList.add('active');
                    feedbackForm.reset();
                }, function(error) {
                    console.error('FAILED...', error);
                    alert('Failed to send feedback automatically. Opening email client instead...');
                    
                    const recipientEmail = "dwightjustin.reyes@olivarezcollege.edu.ph";
                    window.location.href = `mailto:${recipientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent("From: " + email + "\n\n" + message)}`;
                    feedbackModal.classList.remove('active');
                })
                .finally(function() {
                    sendFeedbackBtn.disabled = false;
                    sendFeedbackBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Send Feedback`;
                });
        });

        closeSuccessBtn.addEventListener('click', () => {
            successModal.classList.remove('active');
        });

        // Light / Dark Theme Logic
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        let isDarkMode = false;

        themeToggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isDarkMode = !isDarkMode;

            if (isDarkMode) {
                oc_map.removeLayer(currentTileLayer);
                dark_map.addTo(oc_map);
                currentTileLayer = dark_map;
                
                document.body.classList.add('dark-theme');
                themeIcon.className = 'fa-solid fa-sun';
                themeLabel.textContent = 'Light Mode';
            } else {
                oc_map.removeLayer(currentTileLayer);
                osm_map.addTo(oc_map);
                currentTileLayer = osm_map;

                document.body.classList.remove('dark-theme');
                themeIcon.className = 'fa-solid fa-moon';
                themeLabel.textContent = 'Dark Mode';
            }
            closeMenu();
        });

        // Location Search
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        oc_map.setView([lat, lon], 16);

                        if (searchMarker) {
                            oc_map.removeLayer(searchMarker);
                        }

                        searchMarker = L.marker([lat, lon]).addTo(oc_map)
                            .bindPopup(`<b>${data[0].display_name}</b>`)
                            .openPopup();
                    } else {
                        alert('Location not found. Please try another search term.');
                    }
                })
                .catch(err => {
                    console.error('Search error:', err);
                    alert('Error searching for location.');
                });
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Geolocation Logic for "My Location" Button
        function locateUser() {
            if (!('geolocation' in navigator)) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    if (userMarker) oc_map.removeLayer(userMarker);
                    if (accuracyCircle) oc_map.removeLayer(accuracyCircle);

                    accuracyCircle = L.circle([lat, lng], {
                        radius: accuracy,
                        color: '#0B793D',
                        fillColor: '#0B793D',
                        fillOpacity: 0.15
                    }).addTo(oc_map);

                    userMarker = L.marker([lat, lng]).addTo(oc_map)
                        .bindPopup("You are here!")
                        .openPopup();

                    oc_map.flyTo([lat, lng], 18, { animate: true, duration: 1.5 });
                },
                (error) => {
                    console.warn("Geolocation Error:", error);
                    if (error.code === error.POSITION_UNAVAILABLE) {
                        alert("Device location is turned off. Please turn on Location/GPS in your phone's settings and try again.");
                    } else if (error.code === error.PERMISSION_DENIED) {
                        alert("Location access was denied in your browser settings.");
                    } else {
                        alert("Unable to acquire location signal.");
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        document.getElementById('myLocationBtn').addEventListener('click', locateUser);

        // About & Attributions Modals
        const infoModal = document.getElementById('infoModal');
        const infoModalTitle = document.getElementById('infoModalTitle');
        const infoModalBody = document.getElementById('infoModalBody');
        const closeInfoBtn = document.getElementById('closeInfoBtn');

        document.getElementById('aboutLink').addEventListener('click', (e) => {
            e.preventDefault();
            closeMenu();
            infoModalTitle.innerHTML = `<i class="fa-solid fa-circle-info"></i> About Us / Contact Us`;
            infoModalBody.innerHTML = `
                <p style="margin-bottom:10px;"><strong>OCNP Mobile Navigation</strong></p>
                <p style="margin-bottom:10px;">Providing accurate interactive location mapping and mobile map interfaces.</p>
                <p><strong>Contact:</strong> <br><a href="mailto:dwightjustin.reyes@olivarezcollege.edu.ph" class="break-email">dwightjustin.reyes@olivarezcollege.edu.ph</a></p>
            `;
            infoModal.classList.add('active');
        });

        document.getElementById('attributionsLink').addEventListener('click', (e) => {
            e.preventDefault();
            closeMenu();
            infoModalTitle.innerHTML = `<i class="fa-solid fa-users"></i> Attributions`;
            infoModalBody.innerHTML = `
                <ul class="info-list">
                    <li><i class="fa-solid fa-map"></i> <span>Maps &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors</span></li>
                    <li><i class="fa-solid fa-layer-group"></i> <span>Dark Tiles &copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a></span></li>
                    <li><i class="fa-solid fa-code"></i> <span>Leaflet JS Engine</span></li>
                    <li><i class="fa-solid fa-compass"></i> <span>Leaflet Rotate Plugin by Grzegorz Tomicki</span></li>
                    <li><i class="fa-solid fa-icons"></i> <span>Icons by FontAwesome</span></li>
                </ul>
            `;
            infoModal.classList.add('active');
        });

        closeInfoBtn.addEventListener('click', () => {
            infoModal.classList.remove('active');
        });
    </script>
</body>
</html>
