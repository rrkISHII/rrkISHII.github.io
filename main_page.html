<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Olivarez Navigation Portal</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Leaflet Rotate Plugin CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.css"
    />

    <!-- FontAwesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/design.css" />
  </head>
  <body>
    <!-- Floating search bar with hamburger on the left -->
    <header class="app-header" id="appHeader" data-mode="search">
      <div class="header-search" id="headerSearch">
        <button
          type="button"
          class="menu-btn"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="sideDrawer"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <div class="search-container">
          <input
            type="search"
            class="search-input"
            id="searchInput"
            placeholder="Search location..."
            aria-label="Search map"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="buildingsList"
          />
          <button
            type="button"
            class="search-btn"
            id="searchBtn"
            aria-label="Search"
          >
            <i
              class="fa-solid fa-magnifying-glass"
              id="searchIcon"
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>
      <section
        class="trip-card"
        id="tripCard"
        data-origin="pin"
        aria-label="Walking route"
      >
        <button
          type="button"
          class="trip-back"
          id="tripBackBtn"
          aria-label="Clear route"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>
        <div class="trip-points">
          <button type="button" class="trip-row" id="tripFromBtn">
            <span class="trip-marker"><span class="trip-dot"></span></span
            ><span class="sr-only">From: </span
            ><span class="trip-text" id="tripFromText">Your location</span>
          </button>
          <button type="button" class="trip-row trip-row-to" id="tripToBtn">
            <span class="trip-marker"
              ><i
                class="fa-solid fa-flag-checkered"
                aria-hidden="true"
              ></i></span
            ><span class="sr-only">To: </span
            ><span class="trip-text" id="tripToText">Destination</span>
          </button>
        </div>
        <div class="trip-summary">
          <span class="trip-time" id="tripTime">1 min</span
          ><span class="trip-dist" id="tripDist">0 m</span>
        </div>
      </section>
      <!-- Inline search dropdown -->
      <div class="search-dropdown" id="searchDropdown">
        <ul
          class="buildings-list"
          id="buildingsList"
          role="listbox"
          aria-label="Campus locations"
        >
          <!-- Populated dynamically, alphabetically -->
        </ul>
      </div>
    </header>

    <!-- Where you start (QR / location). The route itself lives in the trip card above. -->
    <div class="status-stack" id="statusStack">
      <div class="status-chip here-chip" id="hereChip" hidden>
        <i
          class="fa-solid fa-location-dot"
          id="hereChipIcon"
          aria-hidden="true"
        ></i>
        <span id="hereChipText"></span>
        <button
          type="button"
          id="clearOriginBtn"
          aria-label="Clear starting point"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div
      class="sr-only"
      id="routeAnnouncer"
      role="status"
      aria-live="polite"
    ></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Side navigation overlay and drawer -->
    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-label="Main menu">
      <div class="drawer-header">
        <h2>OCNP</h2>
        <button
          type="button"
          class="close-btn"
          id="closeDrawer"
          aria-label="Close menu"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <ul class="drawer-menu">
        <li>
          <button type="button" id="themeToggleBtn">
            <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
            <span id="themeLabel">Dark Mode</span>
          </button>
        </li>
        <li>
          <button type="button" id="feedbackLink">
            <i class="fa-solid fa-envelope-open" aria-hidden="true"></i>Feedback
          </button>
        </li>
        <li>
          <button type="button" id="aboutLink">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>About Us /
            Contact Us
          </button>
        </li>
        <li>
          <button type="button" id="attributionsLink">
            <i class="fa-solid fa-users" aria-hidden="true"></i>Attributions
          </button>
        </li>
      </ul>
    </nav>

    <!-- Feedback modal -->
    <div class="modal-overlay" id="feedbackModal">
      <div
        class="feedback-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="feedbackTitle"
      >
        <div class="modal-header">
          <h3 id="feedbackTitle">
            <i class="fa-solid fa-comments" aria-hidden="true"></i> Send
            Feedback
          </h3>
          <button
            type="button"
            class="modal-close-btn"
            id="closeFeedbackBtn"
            aria-label="Close feedback"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <form id="feedbackForm">
          <div class="form-group">
            <label for="userEmail"
              ><i class="fa-regular fa-envelope" aria-hidden="true"></i>
              Email</label
            >
            <input
              type="email"
              id="userEmail"
              class="form-input"
              placeholder="enter your email here"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="feedbackSubject"
              ><i class="fa-solid fa-tag" aria-hidden="true"></i> Subject</label
            >
            <input
              type="text"
              id="feedbackSubject"
              class="form-input"
              placeholder="enter subject here"
              required
            />
          </div>

          <div class="form-group">
            <label for="feedbackMessage"
              ><i class="fa-solid fa-message" aria-hidden="true"></i>
              Feedback</label
            >
            <textarea
              id="feedbackMessage"
              class="form-textarea"
              placeholder="enter your feedback here..."
              rows="4"
              required
            ></textarea>
          </div>

          <button type="submit" class="send-btn" id="sendFeedbackBtn">
            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send
            Feedback
          </button>
        </form>
      </div>
    </div>

    <!-- Feedback sent success popup -->
    <div class="modal-overlay" id="successModal">
      <div
        class="success-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="successTitle"
        aria-describedby="successText"
      >
        <div class="success-icon">
          <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        </div>
        <h3 id="successTitle">Feedback Sent!</h3>
        <p id="successText">
          Thank you for helping us improve OCNP. Your message has been sent to
          support.
        </p>
        <button type="button" class="popup-close-btn" id="closeSuccessBtn">
          Close &amp; Return to Map
        </button>
      </div>
    </div>

    <!-- Generic info modal for About and Attributions -->
    <div class="modal-overlay" id="infoModal">
      <div
        class="feedback-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="infoModalTitle"
      >
        <div class="modal-header">
          <h3 id="infoModalTitle">Info</h3>
          <button
            type="button"
            class="modal-close-btn"
            id="closeInfoBtn"
            aria-label="Close info"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div id="infoModalBody" class="info-modal-body">
          <!-- Dynamic content -->
        </div>
      </div>
    </div>

    <!-- Map container -->
    <div id="oc_map" role="region" aria-label="Campus map"></div>

    <!-- Bottom-right controls -->
    <div class="map-controls-container">
      <button
        type="button"
        class="map-control-btn"
        id="toggleLabelsBtn"
        aria-label="Toggle building labels"
        aria-pressed="false"
        title="Toggle building labels"
      >
        <i class="fa-solid fa-font" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="map-control-btn my-location-btn"
        id="myLocationBtn"
        aria-label="Go to my location"
        title="Go to my location"
      >
        <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Swipeable bottom sheet -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>
    <div
      class="bottom-sheet"
      id="bottomSheet"
      role="dialog"
      aria-labelledby="sheetTitle"
      inert
    >
      <!-- Drag handle area -->
      <div class="sheet-drag-area" id="sheetDragArea">
        <button
          type="button"
          class="sheet-handle-btn"
          id="sheetToggleBtn"
          aria-label="Expand details"
          aria-expanded="false"
          aria-controls="sheetContent"
        >
          <span class="sheet-handle"></span>
        </button>
        <div class="sheet-header">
          <!-- Top Row: Full building name and close button -->
          <div class="sheet-header-top">
            <div class="sheet-header-left">
              <h3 id="sheetTitle" tabindex="-1">Building Title</h3>
            </div>
            <button
              type="button"
              class="sheet-close-btn"
              id="closeSheetBtn"
              aria-label="Close details"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <!-- Bottom Row: Estimated Time & Distance Badges -->
          <div class="sheet-header-right">
            <span class="sheet-stat-badge" id="sheetTimeBadge" hidden>
              <i class="fa-regular fa-clock" aria-hidden="true"></i>
              <span id="sheetTimeText">0 min</span>
            </span>
            <span class="sheet-stat-badge" id="sheetDistanceBadge" hidden>
              <i class="fa-solid fa-person-walking" aria-hidden="true"></i>
              <span id="sheetDistanceText">0 m</span>
            </span>
            <button
              type="button"
              class="sheet-pill-btn"
              id="startHereBtn"
              hidden
            >
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i> Start
              from here
            </button>
          </div>
        </div>
        <!-- Action button -->
        <button type="button" class="destination-btn" id="goToDestinationBtn">
          <i class="fa-solid fa-location-arrow" aria-hidden="true"></i> Go to
          Destination
        </button>
      </div>

      <!-- Scrollable content -->
      <div class="sheet-content" id="sheetContent">
        <div class="sheet-images-gallery" id="sheetImagesGallery">
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 1</span>
            </div>
            <img id="sheetImage1" alt="" />
          </div>
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 2</span>
            </div>
            <img id="sheetImage2" alt="" />
          </div>
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 3</span>
            </div>
            <img id="sheetImage3" alt="" />
          </div>
        </div>

        <p class="sheet-description" id="sheetDescription">
          Building description text goes here...
        </p>
      </div>
    </div>

    <!-- Libraries -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

    ></script>

        isDragging = false;
        bottomSheet.classList.remove("dragging");
        bottomSheet.style.transition = "";

        document.documentElement.style.setProperty(
          "--peek-height",

        if (state === "expanded") {
          bottomSheet.style.transform = "translateY(0px)";
          bottomSheetOverlay.classList.add("active");
        } else if (state === "peek") {
          bottomSheet.style.transform = `translateY(${getPeekOffsetY()}px)`;
          bottomSheetOverlay.classList.remove("active");
        } else {
          bottomSheet.style.transform = "translateY(100%)";
          bottomSheetOverlay.classList.remove("active");

        bottomSheet.inert = state === "closed";
        sheetContent.inert = state !== "expanded";

        sheetToggleBtn.setAttribute(

          String(state === "expanded"),

        document.body.classList.remove("sheet-peek", "sheet-expanded");

            if (e && e.originalEvent) {
              L.DomEvent.stopPropagation(e);
            }
            if (center) {
              oc_map.flyTo([center.lat, center.lng], 19, {
                animate: true,
                duration: 1.2,
              });
            }
            openBottomSheet(buildingObj);
          };

          layer.on("click", handleBuildingClick);

          if (center) {
            const { iconClass, iconColor } = getBuildingIconInfo(buildingName);

            const customIcon = L.divIcon({
              className: "map-label-marker",
              html: `<div class="map-label-pill" aria-hidden="true">
                                   <div class="map-label-icon" style="color: ${iconColor};">
                                       <i class="${iconClass}"></i>
                                   </div>
                                   <span class="map-label-text hide-label">${escapeHtml(buildingName)}</span>
                               </div>`,
              iconSize: null,
              iconAnchor: [15, 15],
            });

            const marker = L.marker(center, { icon: customIcon }).addTo(oc_map);
            marker.getElement().setAttribute("aria-label", buildingName);
            marker.on("click", handleBuildingClick);
            buildingMarkers.push(marker);
          }
        },
      }).addTo(oc_map);

      campusBuildings.sort((a, b) => a.title.localeCompare(b.title));

      /* ==========================================================
           Walkway graph & pathfinding
           ========================================================== */
      const KX = 111320 * Math.cos((14.479 * Math.PI) / 180);
      const KY = 110574;
      const toM = (lng, lat) => [lng * KX, lat * KY];
      const toLL = (p) => L.latLng(p[1] / KY, p[0] / KX);

      function projectOnSeg(p, a, b) {
        const dx = b[0] - a[0],
          dy = b[1] - a[1],
          len2 = dx * dx + dy * dy;
        const t = len2
          ? Math.max(
              0,
              Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2),
            )
          : 0;
        const q = [a[0] + t * dx, a[1] + t * dy];
        return { t, d: Math.hypot(p[0] - q[0], p[1] - q[1]), p: q };
      }

      const gNodes = []; // [x, y] in metres
      const gAdj = []; // gAdj[i] = [{ to, w }]
      const gEdges = []; // [{ a, b, w }], one per walkable segment (used to snap GPS positions)
      const gEdgeKeys = new Set();
      let gComp = []; // connected-component id per node
      let gMainComp = -1; // the largest component; only this one is ever used for routing

      function nodeFor(p) {
        for (let i = 0; i < gNodes.length; i++) {
          if (Math.hypot(gNodes[i][0] - p[0], gNodes[i][1] - p[1]) < NODE_M)
            return i;
        }
        gNodes.push(p);
        gAdj.push([]);
        return gNodes.length - 1;
      }

      function addEdge(a, b) {
        if (a === b) return;
        const key = a < b ? `${a}-${b}` : `${b}-${a}`;
        if (gEdgeKeys.has(key)) return;
        gEdgeKeys.add(key);
        const w = Math.hypot(
          gNodes[a][0] - gNodes[b][0],
          gNodes[a][1] - gNodes[b][1],
        );
        gAdj[a].push({ to: b, w });
        gAdj[b].push({ to: a, w });
        gEdges.push({ a, b, w });
      }

      (function buildWalkGraph() {
        const lines = geojsonData.features
          .filter(
            (f) => f.properties.walkway && f.geometry.type === "LineString",
          )
          .map((f) => f.geometry.coordinates.map((c) => toM(c[0], c[1])));

        lines.forEach((pts, li) => {
          let prev = null;
          const visit = (p) => {
            const id = nodeFor(p);
            if (prev !== null) addEdge(prev, id);
            prev = id;
          };

          visit(pts[0]);
          for (let s = 0; s < pts.length - 1; s++) {
            const a = pts[s],
              b = pts[s + 1],
              extra = [];
            // A vertex of another line that sits on this segment is a junction
            lines.forEach((other, lj) => {
              if (lj === li) return;
              other.forEach((v) => {
                const { t, d } = projectOnSeg(v, a, b);
                if (d < JUNCTION_M && t > 0.02 && t < 0.98)
                  extra.push({ t, v });
              });
            });
            extra.sort((x, y) => x.t - y.t).forEach((e) => visit(e.v));
            visit(b);
          }
        });
      })();

      (function labelComponents() {
        gComp = new Array(gNodes.length).fill(-1);
        const sizes = [];
        for (let s = 0; s < gNodes.length; s++) {
          if (gComp[s] !== -1) continue;
          const id = sizes.length;
          let size = 0;
          const stack = [s];
          gComp[s] = id;
          while (stack.length) {
            const u = stack.pop();
            size++;
            gAdj[u].forEach(({ to }) => {
              if (gComp[to] === -1) {
                gComp[to] = id;
                stack.push(to);
              }
            });
          }
          sizes.push(size);
        }
        gMainComp = sizes.indexOf(Math.max(...sizes));
        if (sizes.length > 1) {
          console.warn(
            `Walkway network has ${sizes.length} separate pieces; only the largest is used.`,
          );
        }
      })();

      function nearestNode(latlng, maxM = ENTRANCE_SNAP_M) {
        const p = toM(latlng.lng, latlng.lat);
        let best = null;
        for (let i = 0; i < gNodes.length; i++) {
          if (gComp[i] !== gMainComp) continue;
          const d = Math.hypot(gNodes[i][0] - p[0], gNodes[i][1] - p[1]);
          if (d <= maxM && (!best || d < best.d)) best = { node: i, d };
        }
        return best;
      }

      function snapToNetwork(latlng, maxM) {
        const p = toM(latlng.lng, latlng.lat);
        let best = null;
        for (const e of gEdges) {
          if (gComp[e.a] !== gMainComp) continue;
          const { t, d, p: q } = projectOnSeg(p, gNodes[e.a], gNodes[e.b]);
          if (d <= maxM && (!best || d < best.d))
            best = { edge: e, t, d, point: q };
        }
        return best;
      }

      /* A "source" is where a route can start, a "target" where it can end.
           leg = metres from the real point to the walkway node, lead/tail = the polyline for that leg. */
      function doorSource(latlng) {
        const hit = nearestNode(latlng);
        return hit ? { node: hit.node, leg: hit.d, lead: [latlng] } : null;
      }

      function doorTarget(latlng) {
        const hit = nearestNode(latlng);
        return hit ? { node: hit.node, leg: hit.d, tail: [latlng] } : null;
      }

      /* A GPS fix is snapped to the nearest point ALONG a walkway, so it can start mid-segment */
      function gpsSources(latlng) {
        const snap = snapToNetwork(latlng, MAX_OFF_NETWORK_M);
        if (!snap) return null;
        const { edge, t, d, point } = snap;
        const lead = [latlng, toLL(point)];
        return [
          { node: edge.a, leg: d + t * edge.w, lead },
          { node: edge.b, leg: d + (1 - t) * edge.w, lead },
        ];
      }

      /* Multi-source Dijkstra: finds the best (source, target) pair in one pass */
      function planRoute(sources, targets) {
        const n = gNodes.length;
        const dist = new Array(n).fill(Infinity);
        const prev = new Array(n).fill(-1);
        const root = new Array(n).fill(-1);
        const done = new Array(n).fill(false);

        sources.forEach((s, i) => {
          if (s.leg < dist[s.node]) {
            dist[s.node] = s.leg;
            root[s.node] = i;
          }
        });

        for (;;) {
          let u = -1;
          for (let i = 0; i < n; i++) {
            if (
              !done[i] &&
              dist[i] < Infinity &&
              (u === -1 || dist[i] < dist[u])
            )
              u = i;
          }
          if (u === -1) break;
          done[u] = true;
          for (const { to, w } of gAdj[u]) {
            if (dist[u] + w < dist[to]) {
              dist[to] = dist[u] + w;
              prev[to] = u;
              root[to] = root[u];
            }
          }
        }

        let best = null;
        targets.forEach((t) => {
          const total = dist[t.node] + t.leg;
          if (total < Infinity && (!best || total < best.total))
            best = { t, total };
        });
        if (!best) return null;

        const nodes = [];
        for (let u = best.t.node; u !== -1; u = prev[u]) nodes.push(u);
        nodes.reverse();
        const src = sources[root[nodes[0]]];

        return {
          distance: best.total,
          path: [
            ...src.lead,
            ...nodes.map((i) => toLL(gNodes[i])),
            ...best.t.tail,
          ],
          start: src.lead[0],
          end: best.t.tail[best.t.tail.length - 1],
        };
      }

      /* origin is { source: 'qr' | 'manual', building, points } or { source: 'gps', latlng } */
      function computeRoute(origin, target) {
        let sources;
        if (origin.source === "gps") {
          sources = gpsSources(origin.latlng);
          if (!sources) {
            return {
              error:
                "You seem to be away from the campus walkways. Move closer, or scan the QR code at your building.",
            };
          }
        } else {
          sources = origin.points.map(doorSource).filter(Boolean);
          if (!sources.length)
            return {
              error: `Can't find a walkway near ${origin.building.title}.`,
            };
        }

        const targets = target.entrances.map(doorTarget).filter(Boolean);
        if (!targets.length)
          return { error: `Can't find a walkway near ${target.title}.` };

        const route = planRoute(sources, targets);
        return route
          ? { route }
          : { error: `No walkable path found to ${target.title}.` };
      }

      /* Route state & display */
      const STYLE_HERE = {
        color: "#f59e0b",
        weight: 3,
        fillColor: "#f59e0b",
        fillOpacity: 0.45,
      };
      const STYLE_DEST = {
        color: "#2563eb",
        weight: 3,
        fillColor: "#2563eb",
        fillOpacity: 0.35,
      };

      const USER_ICON = L.divIcon({
        className: "user-dot",
        html: "<span></span>",
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      });
      const HERE_ICON = L.divIcon({
        className: "here-marker",
        html: "<span></span>",
        iconSize: [44, 44],
        iconAnchor: [22, 22],
      });
      const END_ICON = L.divIcon({
        className: "route-end-marker",
        html: '<span><i class="fa-solid fa-flag-checkered" aria-hidden="true"></i></span>',
        iconSize: [30, 30],
        iconAnchor: [15, 15],
      });

      const hereChip = $("hereChip");
      const hereChipIcon = $("hereChipIcon");
      const hereChipText = $("hereChipText");
      const clearOriginBtn = $("clearOriginBtn");
      const appHeader = $("appHeader");
      const tripCard = $("tripCard");
      const tripFromBtn = $("tripFromBtn");
      const tripFromText = $("tripFromText");
      const tripToBtn = $("tripToBtn");
      const tripToText = $("tripToText");
      const tripTime = $("tripTime");
      const tripDist = $("tripDist");
      const routeAnnouncer = $("routeAnnouncer");
      const startHereBtn = $("startHereBtn");
      const toastEl = $("toast");

      let pinnedOrigin = null; // set by a QR scan or "Start from here"; always wins over GPS
      let hereMarker = null;
      let routeLine = null;
      let routeCasing = null;
      let routeStartDot = null;
      let routeEndMarker = null;
      let routeTarget = null;
      let routeState = null; // { target, originSource, from, distance }
      let pendingTarget = null; // destination to route to as soon as a GPS fix arrives
      let arrivedFor = null;
      let toastTimer = null;

      const gps = {
        watchId: null,
        fix: null,
        recenter: false,
        denied: false,
        lastErrorAt: 0,
        weakNotified: false,
      };

      function storeGet(key) {
        try {
          return sessionStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }
      function storeSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {}
      }
      function storeRemove(key) {
        try {
          localStorage.removeItem(key);
        } catch (e) {}
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 4000);
      }

      function formatRoute(distance) {
        return {
          metres: Math.round(distance),
          minutes: Math.max(1, Math.round(distance / WALK_SPEED_MS / 60)),
        };
      }

      function gpsIsUsable() {
        return !!(gps.fix && gps.fix.accuracy <= GPS_MAX_ACCURACY_M);
      }

      /* Where does a new route start? QR / "Start from here" first, otherwise a usable GPS fix. */
      function getOrigin() {
        if (pinnedOrigin) return pinnedOrigin;
        if (gpsIsUsable())
          return {
            source: "gps",
            latlng: gps.fix.latlng,
            accuracy: gps.fix.accuracy,
          };
        return null;
      }

      function applyHighlights() {
        campusBuildings.forEach((b) => geoLayer.resetStyle(b.layer));
        if (pinnedOrigin) pinnedOrigin.building.layer.setStyle(STYLE_HERE);
        if (routeTarget) routeTarget.layer.setStyle(STYLE_DEST);
      }

      function updateDestinationBtn() {
        const b = activeBuildingData;
        let icon = "fa-location-arrow",
          label = "Go to Destination",
          disabled = false;
        if (b && pinnedOrigin && pinnedOrigin.building === b) {
          icon = "fa-location-dot";
          label = "You are here";
          disabled = true;
        } else if (b && routeTarget === b) {
          icon = "fa-xmark";
          label = "Clear route";
        }
        goToDestinationBtn.innerHTML = `<i class="fa-solid ${icon}" aria-hidden="true"></i> ${label}`;
        goToDestinationBtn.disabled = disabled;
      }

      function updateStartHereBtn() {
        const b = activeBuildingData;
        startHereBtn.hidden =
          !b || !!(pinnedOrigin && pinnedOrigin.building === b);
      }

      /* Time and distance badges only belong to the building the route leads to */
      function updateSheetStats() {
        const show = !!(routeState && activeBuildingData === routeState.target);
        sheetTimeBadge.hidden = !show;
        sheetDistanceBadge.hidden = !show;
        if (show) {
          const { metres, minutes } = formatRoute(routeState.distance);
          sheetDistanceText.textContent = `${metres} m`;
          sheetTimeText.textContent = `${minutes} min`;
        }
      }

      function refreshPeek() {
        if (currentSnapState === "peek") snapToState("peek");
      }

      function refreshSheetActions() {
        updateDestinationBtn();
        updateStartHereBtn();
        updateSheetStats();
        refreshPeek();
      }

      function updateHereChip() {
        let text = "",
          icon = "fa-location-dot",
          label = "",
          gpsMode = false;
        if (pinnedOrigin) {
          text = `You are at ${pinnedOrigin.building.title}`;
          label = "Clear starting point";
        } else if (gps.fix) {
          gpsMode = true;
          icon = "fa-location-crosshairs";
          const acc = Math.round(gps.fix.accuracy);
          text = gpsIsUsable()
            ? `Using your location · ±${acc} m`
            : `Weak GPS signal · ±${acc} m`;
          label = "Turn off location";
        } else if (gps.watchId !== null) {
          gpsMode = true;
          icon = "fa-location-crosshairs";
          text = "Finding your location…";
          label = "Turn off location";
        }
        hereChip.hidden = !text || !!routeState;
        hereChip.classList.toggle("is-gps", gpsMode);
        hereChipIcon.className = `fa-solid ${icon}`;
        hereChipText.textContent = text;
        clearOriginBtn.setAttribute("aria-label", label || "Clear");
      }

      /* The search bar turns into a compact trip card (from / to / time) while a route is showing */
      function doorLabel(name) {
        return String(name).replace(/^entrance\s*(\d+)$/i, "Entrance $1");
      }

      function fromLabel(origin) {
        if (origin.source === "gps") return "Your location";
        return origin.door
          ? `${origin.building.title} · ${doorLabel(origin.door.name)}`
          : origin.building.title;
      }

      function updateTripCard(origin, target, distance) {
        const { metres, minutes } = formatRoute(distance);
        tripFromText.textContent = fromLabel(origin);
        tripToText.textContent = target.title;
        tripTime.textContent =
          distance <= ARRIVE_M ? "Arrived" : `${minutes} min`;
        tripDist.textContent = `${metres} m`;
        tripCard.dataset.origin = origin.source === "gps" ? "gps" : "pin";
      }

      function setTripMode(on) {
        if (!on && tripCard.contains(document.activeElement)) {
          (currentSnapState !== "closed" ? sheetTitle : menuToggle).focus({
            preventScroll: true,
          });
        }
        appHeader.dataset.mode = on ? "trip" : "search";
        document.body.classList.toggle("trip-mode", on);
        if (on) setDropdownOpen(false);
      }

      function removeRouteLayers() {
        [routeLine, routeCasing, routeStartDot, routeEndMarker].forEach(
          (layer) => {
            if (layer) oc_map.removeLayer(layer);
          },
        );
        routeLine = routeCasing = routeStartDot = routeEndMarker = null;
      }

      function clearRoute() {
        removeRouteLayers();
        routeTarget = null;
        routeState = null;
        pendingTarget = null;
        arrivedFor = null;
        setTripMode(false);
        updateHereChip();
        applyHighlights();
        refreshSheetActions();
      }

      function fitRoute() {
        if (!routeLine) return;
        const bottom =
          currentSnapState === "closed" ? 40 : getPeekHeight() + 40;
        const cardHeight =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--trip-height",
            ),
          ) || 104;
        const top =
          (parseFloat(getComputedStyle(appHeader).top) || 12) + cardHeight + 16;
        oc_map.fitBounds(routeLine.getBounds(), {
          paddingTopLeft: [40, top],
          paddingBottomRight: [40, bottom],
          maxZoom: 20,
        });
      }

      function drawRoute(route, origin, target, fit) {
        removeRouteLayers();
        routeCasing = L.polyline(route.path, {
          color: "#ffffff",
          weight: 10,
          opacity: 0.9,
          lineCap: "round",
          lineJoin: "round",
          interactive: false,
        }).addTo(oc_map);
        routeLine = L.polyline(route.path, {
          color: "#0B793D",
          weight: 6,
          opacity: 1,
          lineCap: "round",
          lineJoin: "round",
          interactive: false,
        }).addTo(oc_map);
        if (origin.source !== "gps") {
          routeStartDot = L.circleMarker(route.start, {
            radius: 6,
            color: "#0B793D",
            weight: 3,
            fillColor: "#ffffff",
            fillOpacity: 1,
            interactive: false,
          }).addTo(oc_map);
        }
        routeEndMarker = L.marker(route.end, {
          icon: END_ICON,
          interactive: false,
          keyboard: false,
        }).addTo(oc_map);

        routeTarget = target;
        routeState = {
          target,
          originSource: origin.source,
          from: origin.source === "gps" ? origin.latlng : null,
          distance: route.distance,
        };

        updateTripCard(origin, target, route.distance);
        setTripMode(true);
        updateHereChip();

        applyHighlights();
        refreshSheetActions();
        if (fit) {
          const { metres, minutes } = formatRoute(route.distance);
          routeAnnouncer.textContent = `Route to ${target.title}: ${metres} metres, about ${minutes} minute${minutes === 1 ? "" : "s"} on foot.`;
          fitRoute();
        }
      }

      function checkArrival(route, target) {
        if (route.distance <= ARRIVE_M && arrivedFor !== target) {
          arrivedFor = target;
          showToast(`You have arrived at ${target.title}.`);
        }
      }

      /* Why there is no starting point yet, and what to do about it */
      function needOrigin(target) {
        gps.weakNotified = false;
        if (gps.watchId === null && !gps.denied && locationSupported(true)) {
          pendingTarget = target;
          showToast("Finding your location…");
          startLocation({ recenter: false });
        } else if (gps.watchId !== null && !gps.fix) {
          pendingTarget = target;
          showToast("Still finding your location…");
        } else if (gps.fix) {
          pendingTarget = target;
          showToast(
            `GPS signal is weak (±${Math.round(gps.fix.accuracy)} m). Waiting for a better fix, or scan a QR code / tap “Start from here”.`,
          );
        } else {
          showToast(
            "Scan a QR code, or tap “Start from here” on your building, to get directions.",
          );
        }
        return false;
      }

      function routeTo(target) {
        const origin = getOrigin();
        if (!origin) return needOrigin(target);
        if (origin.building === target) {
          showToast("You are already here.");
          return false;
        }

        const result = computeRoute(origin, target);
        if (result.error) {
          showToast(result.error);
          return false;
        }

        arrivedFor = null;
        drawRoute(result.route, origin, target, true);
        checkArrival(result.route, target);
        return true;
      }

      goToDestinationBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const target = activeBuildingData;
        if (!target) return;
        if (routeTarget === target) {
          clearRoute();
          return;
        }
        routeTo(target);
      });

      $("tripBackBtn").addEventListener("click", clearRoute);

      /* Tap the destination row to bring its details back; tap the start row to look at where you start */
      tripToBtn.addEventListener("click", () => {
        if (!routeTarget) return;
        if (routeTarget.coords)
          oc_map.flyTo([routeTarget.coords.lat, routeTarget.coords.lng], 19, {
            animate: true,
            duration: 1,
          });
        openBottomSheet(routeTarget);
      });

      tripFromBtn.addEventListener("click", () => {
        if (!routeState) return;
        const at =
          routeState.originSource === "gps"
            ? gps.fix && gps.fix.latlng
            : pinnedOrigin &&
              (pinnedOrigin.door
                ? pinnedOrigin.door.latlng
                : pinnedOrigin.building.coords);
        if (at)
          oc_map.flyTo([at.lat, at.lng], 19, { animate: true, duration: 1 });
      });

      /* ==========================================================
           Starting point from a QR code or "Start from here" (location off)
           ========================================================== */
      function normalizeKey(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "");
      }

      function findBuilding(raw) {
        const wanted = normalizeKey(raw);
        if (!wanted) return null;
        return (
          campusBuildings.find(
            (b) =>
              normalizeKey(b.title) === wanted || normalizeKey(b.id) === wanted,
          ) || null
        );
      }

      /* "2", "entrance2" and "Entrance 2" all mean the second door */
      function findDoorIndex(building, raw) {
        if (!raw) return -1;
        const key = normalizeKey(raw);
        const byName = building.doors.findIndex(
          (d) => normalizeKey(d.name) === key,
        );
        if (byName >= 0) return byName;
        const n = parseInt(key.replace(/^entrance/, ""), 10);
        return Number.isInteger(n) && n >= 1 && n <= building.doors.length
          ? n - 1
          : -1;
      }

      function setPinnedOrigin(
        building,
        { source = "manual", doorIndex = -1, fly = true } = {},
      ) {
        clearRoute();
        pendingTarget = null;

        const door = doorIndex >= 0 ? building.doors[doorIndex] : null;
        pinnedOrigin = {
          source,
          building,
          door,
          points: door ? [door.latlng] : building.entrances,
        };

        if (hereMarker) oc_map.removeLayer(hereMarker);
        hereMarker = null;
        const at = door ? door.latlng : building.coords;
        if (at) {
          hereMarker = L.marker(at, {
            interactive: false,
            keyboard: false,
            zIndexOffset: -1000,
            icon: HERE_ICON,
          }).addTo(oc_map);
          if (fly)
            oc_map.flyTo([at.lat, at.lng], 19, {
              animate: true,
              duration: 1.2,
            });
        }

        storeSet(
          ORIGIN_KEY,
          JSON.stringify({
            key: building.id || building.title,
            door: door ? door.name : null,
            source,
          }),
        );
        updateHereChip();
        applyHighlights();
        refreshSheetActions();
      }

      function stripOriginFromUrl() {
        try {
          if (window.location.search) {
            history.replaceState(
              null,
              "",
              window.location.pathname + window.location.hash,
            );
          }
        } catch (e) {}
      }

      function clearPinnedOrigin() {
        pinnedOrigin = null;
        if (hereMarker) oc_map.removeLayer(hereMarker);
        hereMarker = null;
        storeRemove(ORIGIN_KEY);
        stripOriginFromUrl();
        clearRoute();
        updateHereChip();
        applyHighlights();
        refreshSheetActions();
      }

      clearOriginBtn.addEventListener("click", () => {
        if (pinnedOrigin) clearPinnedOrigin();
        else stopLocation();
      });

      startHereBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const b = activeBuildingData;
        if (!b) return;
        setPinnedOrigin(b, { source: "manual", fly: false });
        showToast(
          `Starting point set to ${b.title}. Now pick where you want to go.`,
        );
      });

      /* ==========================================================
           Live location (location on)
           ========================================================== */
      function locationSupported(announce) {
        if (!("geolocation" in navigator)) {
          if (announce) showToast("This browser does not support location.");
          return false;
        }
        if (window.isSecureContext === false) {
          if (announce)
            showToast("Location only works on a secure (https) page.");
          return false;
        }
        return true;
      }

      function drawUserMarker() {
        const { latlng, accuracy } = gps.fix;
        const radius = Math.min(accuracy, 150);
        if (!userMarker) {
          userMarker = L.marker(latlng, {
            icon: USER_ICON,
            interactive: false,
            keyboard: false,
            zIndexOffset: 900,
          }).addTo(oc_map);
          accuracyCircle = L.circle(latlng, {
            radius,
            color: "#2563eb",
            weight: 1,
            fillColor: "#2563eb",
            fillOpacity: 0.12,
            interactive: false,
          }).addTo(oc_map);
        } else {
          userMarker.setLatLng(latlng);
          accuracyCircle.setLatLng(latlng);
          accuracyCircle.setRadius(radius);
        }
      }

      function removeUserMarker() {
        if (userMarker) oc_map.removeLayer(userMarker);
        if (accuracyCircle) oc_map.removeLayer(accuracyCircle);
        userMarker = accuracyCircle = null;
      }

      /* Keep an active GPS route in step with the walker */
      function maybeReroute() {
        if (!routeState || routeState.originSource !== "gps" || pinnedOrigin)
          return;
        const origin = getOrigin();
        if (!origin || origin.source !== "gps") return;
        if (
          routeState.from &&
          routeState.from.distanceTo(origin.latlng) < ROUTE_REFRESH_M
        )
          return;

        const target = routeState.target;
        const result = computeRoute(origin, target);
        if (result.error) return;
        drawRoute(result.route, origin, target, false);
        checkArrival(result.route, target);
      }

      function onGpsFix(position) {
        const c = position.coords;
        gps.fix = {
          latlng: L.latLng(c.latitude, c.longitude),
          accuracy: c.accuracy || 9999,
          time: Date.now(),
        };
        drawUserMarker();

        if (gps.recenter) {
          gps.recenter = false;
          oc_map.flyTo(gps.fix.latlng, Math.max(oc_map.getZoom(), 18), {
            animate: true,
            duration: 1.2,
          });
        }

        updateHereChip();

        if (pendingTarget && gpsIsUsable() && !pinnedOrigin) {
          const target = pendingTarget;
          pendingTarget = null;
          routeTo(target);
        } else if (
          pendingTarget &&
          !pinnedOrigin &&
          !gpsIsUsable() &&
          !gps.weakNotified
        ) {
          gps.weakNotified = true;
          showToast(
            `GPS signal is weak (±${Math.round(gps.fix.accuracy)} m). Waiting for a better fix, or scan a QR code / tap “Start from here”.`,
          );
        } else {
          maybeReroute();
        }
      }

      function onGpsError(error) {
        if (error.code === error.PERMISSION_DENIED) {
          gps.denied = true;
          stopLocation({ remember: false });
          showToast(
            "Location is blocked for this site. Allow it in your browser settings, or scan a QR code instead.",
          );
          return;
        }
        const now = Date.now();
        if (now - gps.lastErrorAt < 15000) return;
        gps.lastErrorAt = now;
        showToast(
          error.code === error.POSITION_UNAVAILABLE
            ? "No location signal. Turn on Location / GPS on your device."
            : "Still looking for your location…",
        );
      }

      function startLocation({ recenter = false } = {}) {
        if (!locationSupported(true) || gps.watchId !== null) return;
        gps.denied = false;
        gps.recenter = recenter;
        storeRemove(GPS_OFF_KEY);
        gps.watchId = navigator.geolocation.watchPosition(
          onGpsFix,
          onGpsError,
          {
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 20000,
          },
        );
        updateHereChip();
      }

      function stopLocation({ remember = true } = {}) {
        if (gps.watchId !== null) navigator.geolocation.clearWatch(gps.watchId);
        gps.watchId = null;
        gps.fix = null;
        gps.recenter = false;
        pendingTarget = null;
        removeUserMarker();
        if (routeState && routeState.originSource === "gps") clearRoute();
        if (remember) storeSet(GPS_OFF_KEY, "1");
        updateHereChip();
      }

      $("myLocationBtn").addEventListener("click", () => {
        if (gps.watchId === null) {
          startLocation({ recenter: true });
          return;
        }
        if (!gps.fix) {
          showToast("Still finding your location…");
          return;
        }
        oc_map.flyTo(gps.fix.latlng, Math.max(oc_map.getZoom(), 18), {
          animate: true,
          duration: 1,
        });
        if (pinnedOrigin) {
          showToast(
            `Directions start from ${pinnedOrigin.building.title}. Tap × on the chip to use your location instead.`,
          );
        }
      });

      /* If the browser already allows location, start without asking again */
      function autoStartLocation() {
        if (storeGet(GPS_OFF_KEY) === "1" || !locationSupported(false)) return;
        if (!navigator.permissions || !navigator.permissions.query) return;
        navigator.permissions
          .query({ name: "geolocation" })
          .then((status) => {
            if (status.state === "granted") startLocation({ recenter: false });
          })
          .catch(() => {});
      }

      /* ==========================================================
           Start-up: QR code in the URL, or the starting point from earlier in this tab
           ========================================================== */
      function initRouting() {
        const params = new URLSearchParams(window.location.search);
        const raw =
          params.get("from") ||
          params.get("start") ||
          params.get("here") ||
          params.get("destination");

        let wanted = null;
        if (raw) {
          wanted = {
            key: raw,
            door: params.get("entrance") || params.get("door"),
            source: "qr",
            fromUrl: true,
          };
        } else {
          try {
            const saved = JSON.parse(storeGet(ORIGIN_KEY) || "null");
            if (saved && saved.key)
              wanted = {
                key: saved.key,
                door: saved.door,
                source: saved.source || "manual",
                fromUrl: false,
              };
          } catch (e) {}
        }

        if (wanted) {
          const building = findBuilding(wanted.key);
          if (building) {
            setPinnedOrigin(building, {
              source: wanted.source,
              doorIndex: findDoorIndex(building, wanted.door),
              fly: true,
            });
          } else if (wanted.fromUrl) {
            showToast(`Could not find “${wanted.key}” on the map.`);
          }
        }

        autoStartLocation();
      }

      /* Toggle Labels */
      const toggleLabelsBtn = $("toggleLabelsBtn");

      toggleLabelsBtn.addEventListener("click", () => {
        labelsVisible = !labelsVisible;
        toggleLabelsBtn.classList.toggle("active", labelsVisible);
        toggleLabelsBtn.setAttribute("aria-pressed", String(labelsVisible));

        document.querySelectorAll(".map-label-text").forEach((labelEl) => {
          labelEl.classList.toggle("hide-label", !labelsVisible);
        });
      });

      /* Search Combobox */
      let visibleBuildings = [];
      let activeIndex = -1;

      function setDropdownOpen(open) {
        searchDropdown.classList.toggle("active", open);
        searchInput.setAttribute("aria-expanded", String(open));
        if (!open) setActiveOption(-1);
      }

      function setActiveOption(index) {
        const options = buildingsList.querySelectorAll(".building-item");
        options.forEach((el) => el.classList.remove("is-active"));
        activeIndex = index;

        if (index >= 0 && options[index]) {
          options[index].classList.add("is-active");
          searchInput.setAttribute("aria-activedescendant", options[index].id);
          options[index].scrollIntoView({ block: "nearest" });
        } else {
          searchInput.removeAttribute("aria-activedescendant");
        }
      }

      function renderBuildingsDropdown(filterText = "") {
        buildingsList.replaceChildren();
        activeIndex = -1;
        searchInput.removeAttribute("aria-activedescendant");

        const query = filterText.toLowerCase();
        visibleBuildings = campusBuildings.filter((b) =>
          b.title.toLowerCase().includes(query),
        );

        if (visibleBuildings.length === 0) {
          const li = document.createElement("li");
          li.className = "no-building-found";
          li.setAttribute("role", "option");
          li.setAttribute("aria-disabled", "true");
          li.textContent = `No building matching "${filterText}"`;
          buildingsList.appendChild(li);
          return;
        }

        visibleBuildings.forEach((building, i) => {
          const li = document.createElement("li");
          li.className = "building-item";
          li.id = `building-option-${i}`;
          li.setAttribute("role", "option");

          const { iconClass, iconColor } = getBuildingIconInfo(building.title);

          const iconWrapper = document.createElement("div");
          iconWrapper.className = "map-label-icon";
          iconWrapper.style.color = iconColor;

          const icon = document.createElement("i");
          icon.className = iconClass;
          icon.setAttribute("aria-hidden", "true");
          iconWrapper.appendChild(icon);

          const label = document.createElement("span");
          label.textContent = building.title;

          li.append(iconWrapper, label);
          li.addEventListener("click", (e) => {
            e.stopPropagation();
            selectBuilding(building);
          });
          buildingsList.appendChild(li);
        });
      }

      function selectBuilding(building) {
        setDropdownOpen(false);
        searchInput.value = building.title;
        updateSearchIconState();

        if (building.coords) {
          oc_map.flyTo([building.coords.lat, building.coords.lng], 19, {
            animate: true,
            duration: 1.2,
          });
        }
        openBottomSheet(building);
      }

      function updateSearchIconState() {
        if (searchInput.value.trim().length > 0) {
          searchIcon.className = "fa-solid fa-xmark";
          searchBtn.setAttribute("aria-label", "Clear search");
        } else {
          searchIcon.className = "fa-solid fa-magnifying-glass";
          searchBtn.setAttribute("aria-label", "Search");
        }
      }

      function openDropdown() {
        renderBuildingsDropdown(searchInput.value.trim());
        setDropdownOpen(true);
      }

      searchInput.addEventListener("focus", openDropdown);

      searchInput.addEventListener("input", () => {
        updateSearchIconState();
        openDropdown();
      });

      searchInput.addEventListener("keydown", (e) => {
        const isOpen = searchDropdown.classList.contains("active");

        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          if (!isOpen) openDropdown();
          if (!visibleBuildings.length) return;
          const step = e.key === "ArrowDown" ? 1 : -1;
          setActiveOption(
            (activeIndex + step + visibleBuildings.length) %
              visibleBuildings.length,
          );
        } else if (e.key === "Enter") {
          if (!isOpen || !visibleBuildings.length) return;
          e.preventDefault();
          if (activeIndex >= 0) {
            selectBuilding(visibleBuildings[activeIndex]);
          } else if (searchInput.value.trim()) {
            selectBuilding(visibleBuildings[0]);
          }
        } else if (e.key === "Escape" && isOpen) {
          e.stopPropagation();
          setDropdownOpen(false);
        }
      });

      searchBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (searchInput.value.trim().length > 0) {
          searchInput.value = "";
          updateSearchIconState();
          openDropdown();
          searchInput.focus();
        } else if (searchDropdown.classList.contains("active")) {
          setDropdownOpen(false);
        } else {
          openDropdown();
          searchInput.focus();
        }
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".app-header")) {
          setDropdownOpen(false);
        }
      });

      /* Perimeter Mask */
      function getMaskStyle(dark) {
        return dark
          ? { fillColor: "#000000", fillOpacity: 0.65 }
          : { fillColor: "#111827", fillOpacity: 0.45 };
      }

      let maskPolygon = null;
      const perimeterFeature = geojsonData.features.find(
        (f) => f.properties && f.properties.perimeter,
      );

      if (perimeterFeature) {
        const perimeterLatLngs = perimeterFeature.geometry.coordinates.map(
          (coord) => [coord[1], coord[0]],
        );

        const worldOuterBounds = [
          [90, -180],
          [90, 180],
          [-90, 180],
          [-90, -180],
        ];

        maskPolygon = L.polygon([worldOuterBounds, perimeterLatLngs], {
          color: "transparent",
          interactive: false,
          ...getMaskStyle(isDarkMode),
        }).addTo(oc_map);
      }

      /* Drawer Menu */
      function openMenu() {
        sideDrawer.classList.add("active");
        navOverlay.classList.add("active");
        menuToggle.setAttribute("aria-expanded", "true");
        closeDrawer.focus();
      }

      function closeMenu(restoreFocus = true) {
        const hadFocusInside = sideDrawer.contains(document.activeElement);
        sideDrawer.classList.remove("active");
        navOverlay.classList.remove("active");
        menuToggle.setAttribute("aria-expanded", "false");
        if (restoreFocus && hadFocusInside) menuToggle.focus();
      }

      menuToggle.addEventListener("click", openMenu);
      closeDrawer.addEventListener("click", () => closeMenu());
      navOverlay.addEventListener("click", () => closeMenu());

      /* Feedback Form */
      const feedbackForm = $("feedbackForm");
      const sendFeedbackBtn = $("sendFeedbackBtn");
      const SEND_LABEL =
        '<i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send Feedback';

      $("feedbackLink").addEventListener("click", () => {
        openModal(feedbackModal, $("userEmail"));
        closeMenu(false);
      });

      $("closeFeedbackBtn").addEventListener("click", () =>
        closeModal(feedbackModal),
      );

      feedbackForm.addEventListener("submit", (e) => {
        e.preventDefault();

        sendFeedbackBtn.disabled = true;
        sendFeedbackBtn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Sending...';

        const email = $("userEmail").value;
        const subject = $("feedbackSubject").value;
        const message = $("feedbackMessage").value;

        const templateParams = {
          name: email,
          email: email,
          subject: subject,
          message: message,
        };

        const request = window.emailjs
          ? emailjs.send(
              EMAIL_CONFIG.serviceId,
              EMAIL_CONFIG.templateId,
              templateParams,
            )
          : Promise.reject(new Error("EmailJS is unavailable"));

        request
          .then(
            () => {
              closeModal(feedbackModal);
              openModal(successModal, $("closeSuccessBtn"));
              feedbackForm.reset();
            },
            (error) => {
              console.error("FAILED...", error);
              alert(
                "Failed to send feedback automatically. Opening email client instead...",
              );
              closeModal(feedbackModal);
              window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent("From: " + email + "\n\n" + message)}`;
            },
          )
          .finally(() => {
            sendFeedbackBtn.disabled = false;
            sendFeedbackBtn.innerHTML = SEND_LABEL;
          });
      });

      $("closeSuccessBtn").addEventListener("click", () =>
        closeModal(successModal),
      );

      /* Theme Toggle */
      const themeToggleBtn = $("themeToggleBtn");
      const themeIcon = $("themeIcon");
      const themeLabel = $("themeLabel");

      function updateThemeUi() {
        themeIcon.className = isDarkMode
          ? "fa-solid fa-sun"
          : "fa-solid fa-moon";
        themeLabel.textContent = isDarkMode ? "Light Mode" : "Dark Mode";
      }

      themeToggleBtn.addEventListener("click", () => {
        isDarkMode = !isDarkMode;

        oc_map.removeLayer(currentTileLayer);
        currentTileLayer = isDarkMode ? dark_map : light_map;
        currentTileLayer.addTo(oc_map);

        document.body.classList.toggle("dark-theme", isDarkMode);
        if (maskPolygon) maskPolygon.setStyle(getMaskStyle(isDarkMode));

        updateThemeUi();
        saveTheme(isDarkMode ? "dark" : "light");
        closeMenu();
      });

      updateThemeUi();

      /* Info Modals */
      const infoModalTitle = $("infoModalTitle");
      const infoModalBody = $("infoModalBody");

      function showInfo(iconClass, title, bodyHtml) {
        infoModalTitle.innerHTML = `<i class="${iconClass}" aria-hidden="true"></i> ${title}`;
        infoModalBody.innerHTML = bodyHtml;
        openModal(infoModal, $("closeInfoBtn"));
        closeMenu(false);
      }

      $("aboutLink").addEventListener("click", () => {
        showInfo(
          "fa-solid fa-circle-info",
          "About Us / Contact Us",
          `
                <p><strong>OCNP Mobile Navigation</strong></p>
                <p>Providing accurate interactive location mapping and mobile map interfaces.</p>
                <p><strong>Contact:</strong><br><a href="mailto:${CONTACT_EMAIL}" class="break-email">${CONTACT_EMAIL}</a></p>
            `,
        );
      });

      $("attributionsLink").addEventListener("click", () => {
        showInfo(
          "fa-solid fa-users",
          "Attributions",
          `
                <ul class="info-list">
                    <li><i class="fa-solid fa-map" aria-hidden="true"></i> <span>Maps &copy; <a href="https://stadiamaps.com/" target="_blank" rel="noopener noreferrer">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank" rel="noopener noreferrer">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors</span></li>
                    <li><i class="fa-solid fa-code" aria-hidden="true"></i> <span>Leaflet JS Engine</span></li>
                    <li><i class="fa-solid fa-compass" aria-hidden="true"></i> <span>Leaflet Rotate Plugin by Grzegorz Tomicki</span></li>
                    <li><i class="fa-solid fa-icons" aria-hidden="true"></i> <span>Icons by FontAwesome</span></li>
                </ul>
            `,
        );
      });

      $("closeInfoBtn").addEventListener("click", () => closeModal(infoModal));

      initRouting();
    </script>
  </body>
</html>
