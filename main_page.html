<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Olivarez Navigation Portal</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet Rotate Plugin CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.css">

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/design.css">

    <style>
        .sheet-header-left {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .sheet-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .sheet-stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface-muted, #f0f4f1);
            color: var(--accent, #0B793D);
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 14px;
            white-space: nowrap;
        }

        body.dark-theme .sheet-stat-badge {
            background: #2a2a2a;
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <!-- Floating search bar -->
    <header class="app-header">
        <button type="button" class="menu-btn" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="sideDrawer">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <div class="search-container">
            <input type="search" class="search-input" id="searchInput" placeholder="Search location..." aria-label="Search map"
                   autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="buildingsList">
            <button type="button" class="search-btn" id="searchBtn" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon" aria-hidden="true"></i>
            </button>
        </div>
        <!-- Inline search dropdown -->
        <div class="search-dropdown" id="searchDropdown">
            <ul class="buildings-list" id="buildingsList" role="listbox" aria-label="Campus locations">
                <!-- Populated dynamically -->
            </ul>
        </div>
    </header>

    <!-- Current location and active route stack -->
    <div class="status-stack" id="statusStack">
        <div class="status-chip here-chip" id="hereChip" hidden>
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <span id="hereChipText"></span>
        </div>
        <div class="status-chip route-chip" id="routeChip" hidden>
            <i class="fa-solid fa-route" aria-hidden="true"></i>
            <span id="routeChipText"></span>
            <button type="button" id="clearRouteBtn" aria-label="Clear route"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Side navigation overlay and drawer -->
    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-label="Main menu">
        <div class="drawer-header">
            <h2>OCNP</h2>
            <button type="button" class="close-btn" id="closeDrawer" aria-label="Close menu"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <ul class="drawer-menu">
            <li>
                <button type="button" id="themeToggleBtn">
                    <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
                    <span id="themeLabel">Dark Mode</span>
                </button>
            </li>
            <li>
                <button type="button" id="feedbackLink">
                    <i class="fa-solid fa-envelope-open" aria-hidden="true"></i>Feedback
                </button>
            </li>
            <li>
                <button type="button" id="aboutLink">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>About Us / Contact Us
                </button>
            </li>
            <li>
                <button type="button" id="attributionsLink">
                    <i class="fa-solid fa-users" aria-hidden="true"></i>Attributions
                </button>
            </li>
        </ul>
    </nav>

    <!-- Feedback modal -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="feedback-window" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
            <div class="modal-header">
                <h3 id="feedbackTitle"><i class="fa-solid fa-comments" aria-hidden="true"></i> Send Feedback</h3>
                <button type="button" class="modal-close-btn" id="closeFeedbackBtn" aria-label="Close feedback"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>

            <form id="feedbackForm">
                <div class="form-group">
                    <label for="userEmail"><i class="fa-regular fa-envelope" aria-hidden="true"></i> Email</label>
                    <input type="email" id="userEmail" class="form-input" placeholder="enter your email here" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="feedbackSubject"><i class="fa-solid fa-tag" aria-hidden="true"></i> Subject</label>
                    <input type="text" id="feedbackSubject" class="form-input" placeholder="enter subject here" required>
                </div>

                <div class="form-group">
                    <label for="feedbackMessage"><i class="fa-solid fa-message" aria-hidden="true"></i> Feedback</label>
                    <textarea id="feedbackMessage" class="form-textarea" placeholder="enter your feedback here..." rows="4" required></textarea>
                </div>

                <button type="submit" class="send-btn" id="sendFeedbackBtn">
                    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send Feedback
                </button>
            </form>
        </div>
    </div>

    <!-- Feedback sent success popup -->
    <div class="modal-overlay" id="successModal">
        <div class="success-popup" role="dialog" aria-modal="true" aria-labelledby="successTitle" aria-describedby="successText">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
            </div>
            <h3 id="successTitle">Feedback Sent!</h3>
            <p id="successText">Thank you for helping us improve OCNP. Your message has been sent to support.</p>
            <button type="button" class="popup-close-btn" id="closeSuccessBtn">Close &amp; Return to Map</button>
        </div>
    </div>

    <!-- Generic info modal for About and Attributions -->
    <div class="modal-overlay" id="infoModal">
        <div class="feedback-window" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
            <div class="modal-header">
                <h3 id="infoModalTitle">Info</h3>
                <button type="button" class="modal-close-btn" id="closeInfoBtn" aria-label="Close info"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
            <div id="infoModalBody" class="info-modal-body">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Map container -->
    <div id="oc_map" role="region" aria-label="Campus map"></div>

    <!-- Bottom-right controls -->
    <div class="map-controls-container">
        <button type="button" class="map-control-btn" id="toggleLabelsBtn" aria-label="Toggle building labels" aria-pressed="false" title="Toggle building labels">
            <i class="fa-solid fa-font" aria-hidden="true"></i>
        </button>

        <button type="button" class="map-control-btn my-location-btn" id="myLocationBtn" aria-label="Go to my location" title="Go to my location">
            <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
        </button>
    </div>

    <!-- Swipeable bottom sheet -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet" role="dialog" aria-labelledby="sheetTitle" inert>
        <!-- Drag handle area -->
        <div class="sheet-drag-area" id="sheetDragArea">
            <button type="button" class="sheet-handle-btn" id="sheetToggleBtn" aria-label="Expand details" aria-expanded="false" aria-controls="sheetContent">
                <span class="sheet-handle"></span>
            </button>
            <div class="sheet-header">
                <div class="sheet-header-top">
                    <div class="sheet-header-left">
                        <h3 id="sheetTitle" tabindex="-1">Building Title</h3>
                    </div>
                    <button type="button" class="sheet-close-btn" id="closeSheetBtn" aria-label="Close details">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="sheet-header-right">
                    <span class="sheet-stat-badge" id="sheetTimeBadge" hidden>
                        <i class="fa-regular fa-clock" aria-hidden="true"></i>
                        <span id="sheetTimeText">0 min</span>
                    </span>
                    <span class="sheet-stat-badge" id="sheetDistanceBadge" hidden>
                        <i class="fa-solid fa-person-walking" aria-hidden="true"></i>
                        <span id="sheetDistanceText">0 m</span>
                    </span>
                </div>
            </div>
            <!-- Action button -->
            <button type="button" class="destination-btn" id="goToDestinationBtn">
                <i class="fa-solid fa-location-arrow" aria-hidden="true"></i> Go to Destination
            </button>
        </div>

        <!-- Scrollable content -->
        <div class="sheet-content" id="sheetContent">
            <div class="sheet-images-gallery" id="sheetImagesGallery">
                <div class="sheet-image-box">
                    <div class="sheet-placeholder-text">
                        <i class="fa-solid fa-image" aria-hidden="true"></i>
                        <span>Photo 1</span>
                    </div>
                    <img id="sheetImage1" alt="">
                </div>
                <div class="sheet-image-box">
                    <div class="sheet-placeholder-text">
                        <i class="fa-solid fa-image" aria-hidden="true"></i>
                        <span>Photo 2</span>
                    </div>
                    <img id="sheetImage2" alt="">
                </div>
                <div class="sheet-image-box">
                    <div class="sheet-placeholder-text">
                        <i class="fa-solid fa-image" aria-hidden="true"></i>
                        <span>Photo 3</span>
                    </div>
                    <img id="sheetImage3" alt="">
                </div>
            </div>

            <p class="sheet-description" id="sheetDescription">
                Building description text goes here...
            </p>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.umd.min.js"></script>

        sheetToggleBtn.addEventListener('click', () => {
            snapToState(currentSnapState === 'expanded' ? 'peek' : 'expanded');
        });

        /* GeoJSON Buildings */
        const NON_NAME_KEYS = ['entrances', 'perimeter', 'walkway', 'label'];

        function getBuildingKey(props) {
            if (props.name) return 'name';
            return Object.keys(props).find((k) => !NON_NAME_KEYS.includes(k)) || null;
        }

        const geoLayer = L.geoJSON(geojsonData, {
            filter: (feature) => DEBUG_WALKWAYS || feature.properties.walkway !== "walkway",
            style: function (feature) {
                const props = feature.properties;
                if (props.perimeter) {
                    return { color: '#d9534f', weight: 3, dashArray: '5, 5', fill: false };
                } else if (props.walkway === "walkway") {
                    return { color: '#8a8a8a', weight: 2, dashArray: '2 4', opacity: 0.8 };
                } else if (!getBuildingKey(props)) {
                    return { color: '#8a8a8a', weight: 1, fillColor: '#8a8a8a', fillOpacity: 0.15 };
                } else if (props.PARKING) {
                    return { color: '#2196F3', weight: 1.5, fillColor: '#2196F3', fillOpacity: 0.25 };
                }
                return { color: '#0B793D', weight: 1.5, fillColor: '#0B793D', fillOpacity: 0.2 };
            },
            onEachFeature: function (feature, layer) {
                const props = feature.properties;
                if (props.perimeter || props.walkway === "walkway" || feature.geometry.type === 'Point') return;

                const nameKey = getBuildingKey(props);
                if (!nameKey) return;

                let center = null;
                try {
                    center = layer.getBounds().getCenter();
                } catch (e) {
                    console.warn('Invalid bounds for feature.');
                }

                const buildingName = props.name || nameKey;
                const buildingId = props.name ? (props.id || '') : (props[nameKey] || '');

                const entrances = (props.entrances || [])
                    .filter((e) => !/^car/i.test(e.name))
                    .map((e) => L.latLng(e.coords[1], e.coords[0]));

                const buildingObj = {
                    title: buildingName,
                    id: buildingId,
                    description: `Building ID: ${buildingId}`,
                    imageUrls: [],
                    coords: center,
                    entrances: entrances.length ? entrances : (center ? [center] : []),
                    layer: layer
                };

                campusBuildings.push(buildingObj);

                const handleBuildingClick = (e) => {
                    if (e && e.originalEvent) {
                        L.DomEvent.stopPropagation(e);
                    }
                    if (center) {
                        oc_map.flyTo([center.lat, center.lng], 19, { animate: true, duration: 1.2 });
                    }
                    openBottomSheet(buildingObj);
                };

                layer.on('click', handleBuildingClick);

                if (center) {
                    let iconClass = 'fa-solid fa-building';
                    let iconColor = '#0B793D';

                    if (buildingName.includes('GYM')) {
                        iconClass = 'fa-solid fa-dumbbell';
                    } else if (buildingName.includes('HOSPITAL') || buildingName.includes('EYE CENTER') || buildingName.includes('CLINIC')) {
                        iconClass = 'fa-solid fa-hospital';
                        iconColor = '#d9534f';
                    } else if (buildingName.includes('PARKING')) {
                        iconClass = 'fa-solid fa-square-parking';
                        iconColor = '#2196F3';
                    }

                    const customIcon = L.divIcon({
                        className: 'map-label-marker',
                        html: `<div class="map-label-pill" aria-hidden="true">
                                   <div class="map-label-icon" style="color: ${iconColor};">
                                       <i class="${iconClass}"></i>
                                   </div>
                                   <span class="map-label-text hide-label">${escapeHtml(buildingName)}</span>
                               </div>`,
                        iconSize: null,
                        iconAnchor: [15, 15]
                    });

                    const marker = L.marker(center, { icon: customIcon }).addTo(oc_map);
                    marker.getElement().setAttribute('aria-label', buildingName);
                    marker.on('click', handleBuildingClick);
                    buildingMarkers.push(marker);
                }
            }
        }).addTo(oc_map);

        campusBuildings.sort((a, b) => a.title.localeCompare(b.title));

        /* Walkway Graph & Pathfinding */
        const KX = 111320 * Math.cos(14.479 * Math.PI / 180);
        const KY = 110574;
        const toM = (lng, lat) => [lng * KX, lat * KY];
        const toLL = (p) => L.latLng(p[1] / KY, p[0] / KX);

        function projectOnSeg(p, a, b) {
            const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy;
            const t = len2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2)) : 0;
            return { t, d: Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy)) };
        }

        const gNodes = [];
        const gAdj = [];

        function nodeFor(p) {
            for (let i = 0; i < gNodes.length; i++) {
                if (Math.hypot(gNodes[i][0] - p[0], gNodes[i][1] - p[1]) < NODE_M) return i;
            }
            gNodes.push(p);
            gAdj.push([]);
            return gNodes.length - 1;
        }

        (function buildWalkGraph() {
            const lines = geojsonData.features
                .filter((f) => f.properties.walkway === "walkway" && f.geometry.type === 'LineString')
                .map((f) => f.geometry.coordinates.map((c) => toM(c[0], c[1])));

            lines.forEach((pts, li) => {
                let prev = null;
                const visit = (p) => {
                    const id = nodeFor(p);
                    if (prev !== null && prev !== id) {
                        const w = Math.hypot(gNodes[prev][0] - gNodes[id][0], gNodes[prev][1] - gNodes[id][1]);
                        gAdj[prev].push({ to: id, w });
                        gAdj[id].push({ to: prev, w });
                    }
                    prev = id;
                };

                visit(pts[0]);
                for (let s = 0; s < pts.length - 1; s++) {
                    const a = pts[s], b = pts[s + 1], extra = [];
                    lines.forEach((other, lj) => {
                        if (lj === li) return;
                        other.forEach((v) => {
                            const { t, d } = projectOnSeg(v, a, b);
                            if (d < JUNCTION_M && t > 0.02 && t < 0.98) extra.push({ t, v });
                        });
                    });
                    extra.sort((x, y) => x.t - y.t).forEach((e) => visit(e.v));
                    visit(b);
                }
            });
        })();

        function nearestNode(latlng) {
            const p = toM(latlng.lng, latlng.lat);
            let best = -1, bestD = ENTRANCE_SNAP_M;
            gNodes.forEach((n, i) => {
                const d = Math.hypot(n[0] - p[0], n[1] - p[1]);
                if (d < bestD) { bestD = d; best = i; }
            });
            return best;
        }

        function dijkstra(src) {
            const dist = new Array(gNodes.length).fill(Infinity);
            const prev = new Array(gNodes.length).fill(-1);
            const done = new Array(gNodes.length).fill(false);
            dist[src] = 0;
            for (;;) {
                let u = -1;
                for (let i = 0; i < gNodes.length; i++) {
                    if (!done[i] && (u === -1 || dist[i] < dist[u])) u = i;
                }
                if (u === -1 || dist[u] === Infinity) break;
                done[u] = true;
                gAdj[u].forEach(({ to, w }) => {
                    if (dist[u] + w < dist[to]) { dist[to] = dist[u] + w; prev[to] = u; }
                });
            }
            return { dist, prev };
        }

        function findRoute(fromPts, toPts) {
            let best = null;
            fromPts.forEach((a) => {
                const s = nearestNode(a);
                if (s < 0) return;
                const { dist, prev } = dijkstra(s);
                toPts.forEach((b) => {
                    const t = nearestNode(b);
                    if (t < 0 || dist[t] === Infinity || (best && dist[t] >= best.distance)) return;
                    const path = [];
                    for (let n = t; n !== -1; n = prev[n]) path.push(toLL(gNodes[n]));
                    best = { distance: dist[t], path: [a, ...path.reverse(), b] };
                });
            });
            return best;
        }

        /* Route Display & Highlights */
        const STYLE_HERE = { color: '#f59e0b', weight: 3, fillColor: '#f59e0b', fillOpacity: 0.45 };
        const STYLE_DEST = { color: '#2563eb', weight: 3, fillColor: '#2563eb', fillOpacity: 0.35 };

        const hereChip = $('hereChip');
        const hereChipText = $('hereChipText');
        const routeChip = $('routeChip');
        const routeChipText = $('routeChipText');
        const toastEl = $('toast');

        let origin = null;
        let hereMarker = null;
        let routeLine = null;
        let routeCasing = null;
        let routeTarget = null;
        let toastTimer = null;

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
        }

        function applyHighlights() {
            campusBuildings.forEach((b) => geoLayer.resetStyle(b.layer));
            if (origin && origin.building) origin.building.layer.setStyle(STYLE_HERE);
            if (routeTarget) routeTarget.layer.setStyle(STYLE_DEST);
        }

        function updateDestinationBtn() {
            const b = activeBuildingData;
            let icon = 'fa-location-arrow', label = 'Go to Destination', disabled = false;
            if (b && origin && origin.building === b) {
                icon = 'fa-location-dot'; label = 'You are here'; disabled = true;
            } else if (b && routeTarget === b) {
                icon = 'fa-xmark'; label = 'Clear route';
            }
            goToDestinationBtn.innerHTML = `<i class="fa-solid ${icon}" aria-hidden="true"></i> ${label}`;
            goToDestinationBtn.disabled = disabled;
        }

        function clearRoute() {
            if (routeLine) oc_map.removeLayer(routeLine);
            if (routeCasing) oc_map.removeLayer(routeCasing);
            routeLine = routeCasing = routeTarget = null;
            routeChip.hidden = true;

            sheetTimeBadge.hidden = true;
            sheetDistanceBadge.hidden = true;

            applyHighlights();
            updateDestinationBtn();
        }

        function setOriginFromBuilding(b) {
            clearRoute();
            origin = { source: 'qr', building: b, points: b.entrances };

            hereChipText.textContent = `You are at ${b.title}`;
            hereChip.hidden = false;

            if (hereMarker) oc_map.removeLayer(hereMarker);
            if (b.coords) {
                hereMarker = L.marker(b.coords, {
                    interactive: false,
                    keyboard: false,
                    zIndexOffset: -1000,
                    icon: L.divIcon({ className: 'here-marker', html: '<span></span>', iconSize: [44, 44], iconAnchor: [22, 22] })
                }).addTo(oc_map);
                oc_map.flyTo([b.coords.lat, b.coords.lng], 19, { animate: true, duration: 1.2 });
            }

            applyHighlights();
            updateDestinationBtn();
        }

        function showRoute(fromPts, target) {
            const route = findRoute(fromPts, target.entrances);
            if (!route) {
                showToast(`No walkable path found to ${target.title}.`);
                return;
            }

            clearRoute();
            routeCasing = L.polyline(route.path, { color: '#ffffff', weight: 10, opacity: 0.9, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(oc_map);
            routeLine = L.polyline(route.path, { color: '#0B793D', weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(oc_map);
            routeTarget = target;

            const metres = Math.round(route.distance);
            const minutes = Math.max(1, Math.round(route.distance / WALK_SPEED_MS / 60));

            routeChipText.textContent = `${target.title} · ${metres} m · about ${minutes} min`;
            routeChip.hidden = false;

            sheetDistanceText.textContent = `${metres} m`;
            sheetTimeText.textContent = `${minutes} min`;
            sheetDistanceBadge.hidden = false;
            sheetTimeBadge.hidden = false;

            applyHighlights();
            updateDestinationBtn();

            oc_map.fitBounds(routeLine.getBounds(), {
                paddingTopLeft: [40, $('statusStack').getBoundingClientRect().bottom + 20],
                paddingBottomRight: [40, getPeekHeight() + 40],
                maxZoom: 20
            });
        }

        goToDestinationBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const target = activeBuildingData;
            if (!target) return;

            if (routeTarget === target) { clearRoute(); return; }
            if (!origin) {
                showToast('Scan the QR code at your building, or turn on location, to get directions.');
                return;
            }
            if (origin.building === target) { showToast('You are already here.'); return; }
            showRoute(origin.points, target);
        });

        $('clearRouteBtn').addEventListener('click', clearRoute);

        /* QR Code Scanner */
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('from') || params.get('destination');
            if (!raw) return;

            const wanted = raw.trim().toLowerCase();
            const found = campusBuildings.find((b) =>
                b.title.trim().toLowerCase() === wanted || String(b.id).trim().toLowerCase() === wanted);

            if (found) {
                setTimeout(() => setOriginFromBuilding(found), 600);
            } else {
                showToast(`Could not find "${raw}" on the map.`);
            }
        });

        /* Toggle Labels */
        const toggleLabelsBtn = $('toggleLabelsBtn');

        toggleLabelsBtn.addEventListener('click', () => {
            labelsVisible = !labelsVisible;
            toggleLabelsBtn.classList.toggle('active', labelsVisible);
            toggleLabelsBtn.setAttribute('aria-pressed', String(labelsVisible));

            document.querySelectorAll('.map-label-text').forEach((labelEl) => {
                labelEl.classList.toggle('hide-label', !labelsVisible);
            });
        });

        /* Search Combobox */
        let visibleBuildings = [];
        let activeIndex = -1;

        function setDropdownOpen(open) {
            searchDropdown.classList.toggle('active', open);
            searchInput.setAttribute('aria-expanded', String(open));
            if (!open) setActiveOption(-1);
        }

        function setActiveOption(index) {
            const options = buildingsList.querySelectorAll('.building-item');
            options.forEach((el) => el.classList.remove('is-active'));
            activeIndex = index;

            if (index >= 0 && options[index]) {
                options[index].classList.add('is-active');
                searchInput.setAttribute('aria-activedescendant', options[index].id);
                options[index].scrollIntoView({ block: 'nearest' });
            } else {
                searchInput.removeAttribute('aria-activedescendant');
            }
        }

        function renderBuildingsDropdown(filterText = '') {
            buildingsList.replaceChildren();
            activeIndex = -1;
            searchInput.removeAttribute('aria-activedescendant');

            const query = filterText.toLowerCase();
            visibleBuildings = campusBuildings.filter((b) => b.title.toLowerCase().includes(query));

            if (visibleBuildings.length === 0) {
                const li = document.createElement('li');
                li.className = 'no-building-found';
                li.setAttribute('role', 'option');
                li.setAttribute('aria-disabled', 'true');
                li.textContent = `No building matching "${filterText}"`;
                buildingsList.appendChild(li);
                return;
            }

            visibleBuildings.forEach((building, i) => {
                const li = document.createElement('li');
                li.className = 'building-item';
                li.id = `building-option-${i}`;
                li.setAttribute('role', 'option');

                const icon = document.createElement('i');
                icon.className = 'fa-solid fa-building';
                icon.setAttribute('aria-hidden', 'true');

                const label = document.createElement('span');
                label.textContent = building.title;

                li.append(icon, label);
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectBuilding(building);
                });
                buildingsList.appendChild(li);
            });
        }

        function selectBuilding(building) {
            setDropdownOpen(false);
            searchInput.value = building.title;
            updateSearchIconState();

            if (building.coords) {
                oc_map.flyTo([building.coords.lat, building.coords.lng], 19, { animate: true, duration: 1.2 });
            }
            openBottomSheet(building);
        }

        function updateSearchIconState() {
            if (searchInput.value.trim().length > 0) {
                searchIcon.className = 'fa-solid fa-xmark';
                searchBtn.setAttribute('aria-label', 'Clear search');
            } else {
                searchIcon.className = 'fa-solid fa-magnifying-glass';
                searchBtn.setAttribute('aria-label', 'Search');
            }
        }

        function openDropdown() {
            renderBuildingsDropdown(searchInput.value.trim());
            setDropdownOpen(true);
        }

        searchInput.addEventListener('focus', openDropdown);

        searchInput.addEventListener('input', () => {
            updateSearchIconState();
            openDropdown();
        });

        searchInput.addEventListener('keydown', (e) => {
            const isOpen = searchDropdown.classList.contains('active');

            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!isOpen) openDropdown();
                if (!visibleBuildings.length) return;
                const step = e.key === 'ArrowDown' ? 1 : -1;
                setActiveOption((activeIndex + step + visibleBuildings.length) % visibleBuildings.length);
            } else if (e.key === 'Enter') {
                if (!isOpen || !visibleBuildings.length) return;
                e.preventDefault();
                if (activeIndex >= 0) {
                    selectBuilding(visibleBuildings[activeIndex]);
                } else if (searchInput.value.trim()) {
                    selectBuilding(visibleBuildings[0]);
                }
            } else if (e.key === 'Escape' && isOpen) {
                e.stopPropagation();
                setDropdownOpen(false);
            }
        });

        searchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (searchInput.value.trim().length > 0) {
                searchInput.value = '';
                updateSearchIconState();
                openDropdown();
                searchInput.focus();
            } else if (searchDropdown.classList.contains('active')) {
                setDropdownOpen(false);
            } else {
                openDropdown();
                searchInput.focus();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.app-header')) {
                setDropdownOpen(false);
            }
        });

        /* Perimeter Mask */
        function getMaskStyle(dark) {
            return dark
                ? { fillColor: '#000000', fillOpacity: 0.65 }
                : { fillColor: '#111827', fillOpacity: 0.45 };
        }

        let maskPolygon = null;
        const perimeterFeature = geojsonData.features.find((f) => f.properties && f.properties.perimeter);

        if (perimeterFeature) {
            const perimeterLatLngs = perimeterFeature.geometry.coordinates.map((coord) => [coord[1], coord[0]]);

            const worldOuterBounds = [
                [90, -180],
                [90, 180],
                [-90, 180],
                [-90, -180]
            ];

            maskPolygon = L.polygon([worldOuterBounds, perimeterLatLngs], {
                color: 'transparent',
                interactive: false,
                ...getMaskStyle(isDarkMode)
            }).addTo(oc_map);
        }

        /* Drawer Menu */
        function openMenu() {
            sideDrawer.classList.add('active');
            navOverlay.classList.add('active');
            menuToggle.setAttribute('aria-expanded', 'true');
            closeDrawer.focus();
        }

        function closeMenu(restoreFocus = true) {
            const hadFocusInside = sideDrawer.contains(document.activeElement);
            sideDrawer.classList.remove('active');
            navOverlay.classList.remove('active');
            menuToggle.setAttribute('aria-expanded', 'false');
            if (restoreFocus && hadFocusInside) menuToggle.focus();
        }

        menuToggle.addEventListener('click', openMenu);
        closeDrawer.addEventListener('click', () => closeMenu());
        navOverlay.addEventListener('click', () => closeMenu());

        /* Feedback Form */
        const feedbackForm = $('feedbackForm');
        const sendFeedbackBtn = $('sendFeedbackBtn');
        const SEND_LABEL = '<i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send Feedback';

        $('feedbackLink').addEventListener('click', () => {
            openModal(feedbackModal, $('userEmail'));
            closeMenu(false);
        });

        $('closeFeedbackBtn').addEventListener('click', () => closeModal(feedbackModal));

        feedbackForm.addEventListener('submit', (e) => {
            e.preventDefault();

            sendFeedbackBtn.disabled = true;
            sendFeedbackBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Sending...';

            const email = $('userEmail').value;
            const subject = $('feedbackSubject').value;
            const message = $('feedbackMessage').value;

            const templateParams = { name: email, email: email, subject: subject, message: message };

            const request = window.emailjs
                ? emailjs.send(EMAIL_CONFIG.serviceId, EMAIL_CONFIG.templateId, templateParams)
                : Promise.reject(new Error('EmailJS is unavailable'));

            request
                .then(() => {
                    closeModal(feedbackModal);
                    openModal(successModal, $('closeSuccessBtn'));
                    feedbackForm.reset();
                }, (error) => {
                    console.error('FAILED...', error);
                    alert('Failed to send feedback automatically. Opening email client instead...');
                    closeModal(feedbackModal);
                    window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent('From: ' + email + '\n\n' + message)}`;
                })
                .finally(() => {
                    sendFeedbackBtn.disabled = false;
                    sendFeedbackBtn.innerHTML = SEND_LABEL;
                });
        });

        $('closeSuccessBtn').addEventListener('click', () => closeModal(successModal));

        /* Theme Toggle */
        const themeToggleBtn = $('themeToggleBtn');
        const themeIcon = $('themeIcon');
        const themeLabel = $('themeLabel');

        function updateThemeUi() {
            themeIcon.className = isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            themeLabel.textContent = isDarkMode ? 'Light Mode' : 'Dark Mode';
        }

        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;

            oc_map.removeLayer(currentTileLayer);
            currentTileLayer = isDarkMode ? dark_map : light_map;
            currentTileLayer.addTo(oc_map);

            document.body.classList.toggle('dark-theme', isDarkMode);
            if (maskPolygon) maskPolygon.setStyle(getMaskStyle(isDarkMode));

            updateThemeUi();
            saveTheme(isDarkMode ? 'dark' : 'light');
            closeMenu();
        });

        updateThemeUi();

        /* Geolocation */
        function locateUser() {
            if (!('geolocation' in navigator)) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    if (userMarker) oc_map.removeLayer(userMarker);
                    if (accuracyCircle) oc_map.removeLayer(accuracyCircle);

                    accuracyCircle = L.circle([lat, lng], {
                        radius: accuracy,
                        color: '#0B793D',
                        fillColor: '#0B793D',
                        fillOpacity: 0.15
                    }).addTo(oc_map);

                    userMarker = L.marker([lat, lng]).addTo(oc_map)
                        .bindPopup("You are here!")
                        .openPopup();

                    oc_map.flyTo([lat, lng], 18, { animate: true, duration: 1.5 });
                },
                (error) => {
                    console.warn("Geolocation Error:", error);
                    if (error.code === error.POSITION_UNAVAILABLE) {
                        alert("Device location is turned off. Please turn on Location/GPS.");
                    } else if (error.code === error.PERMISSION_DENIED) {
                        alert("Location access was denied in your browser settings.");
                    } else {
                        alert("Unable to acquire location signal.");
                    }
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        $('myLocationBtn').addEventListener('click', locateUser);

        /* Info Modals */
        const infoModalTitle = $('infoModalTitle');
        const infoModalBody = $('infoModalBody');

        function showInfo(iconClass, title, bodyHtml) {
            infoModalTitle.innerHTML = `<i class="${iconClass}" aria-hidden="true"></i> ${title}`;
            infoModalBody.innerHTML = bodyHtml;
            openModal(infoModal, $('closeInfoBtn'));
            closeMenu(false);
        }

        $('aboutLink').addEventListener('click', () => {
            showInfo('fa-solid fa-circle-info', 'About Us / Contact Us', `
                <p><strong>OCNP Mobile Navigation</strong></p>
                <p>Providing accurate interactive location mapping and mobile map interfaces.</p>
                <p><strong>Contact:</strong><br><a href="mailto:${CONTACT_EMAIL}" class="break-email">${CONTACT_EMAIL}</a></p>
            `);
        });

        $('attributionsLink').addEventListener('click', () => {
