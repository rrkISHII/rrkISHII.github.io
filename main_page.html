<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mobile Map App</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Leaflet Rotate Plugin CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.css">

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/design.css">

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {

</head>
<body>

    <!-- Header Floating Search Bar with Hamburger on Left -->
    <header class="app-header">
        <button class="menu-btn" id="menuToggle" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search location..." aria-label="Search map">
            <button class="search-btn" id="searchBtn" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>

    <!-- Side Navigation Overlay & Drawer -->
    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <h2>OCNP</h2>
            <button class="close-btn" id="closeDrawer" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="drawer-menu">
            <li>
                <a href="#" id="themeToggleBtn">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                    <span id="themeLabel">Dark Mode</span>
                </a>
            </li>
            <li>
                <a href="#" id="feedbackLink">
                    <i class="fa-solid fa-envelope-open"></i>Feedback
                </a>
            </li>
            <li>
                <a href="#" id="aboutLink">
                    <i class="fa-solid fa-circle-info"></i>About Us / Contact Us
                </a>
            </li>
            <li>
                <a href="#" id="attributionsLink">
                    <i class="fa-solid fa-users"></i>Attributions
                </a>
            </li>
        </ul>
    </nav>

    <!-- Feedback Modal Window -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="feedback-window">
            <div class="modal-header">
                <h3><i class="fa-solid fa-comments"></i> Send Feedback</h3>
                <button class="modal-close-btn" id="closeFeedbackBtn" aria-label="Close feedback"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="userEmail"><i class="fa-regular fa-envelope"></i> Email</label>
                    <input type="email" id="userEmail" class="form-input" placeholder="enter your email here" required>
                </div>

                <div class="form-group">
                    <label for="feedbackSubject"><i class="fa-solid fa-tag"></i> Subject</label>
                    <input type="text" id="feedbackSubject" class="form-input" placeholder="enter subject here" required>
                </div>

                <div class="form-group">
                    <label for="feedbackMessage"><i class="fa-solid fa-message"></i> Feedback</label>
                    <textarea id="feedbackMessage" class="form-textarea" placeholder="enter your feedback here..." rows="4" required></textarea>
                </div>

                <button type="submit" class="send-btn" id="sendFeedbackBtn">
                    <i class="fa-solid fa-paper-plane"></i> Send Feedback
                </button>
            </form>
        </div>
    </div>

    <!-- Feedback Sent Success Alert Popup -->
    <div class="modal-overlay" id="successModal">
        <div class="success-popup">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3>Feedback Sent!</h3>
            <p>Thank you for helping us improve OCNP. Your message has been sent to support.</p>
            <button class="popup-close-btn" id="closeSuccessBtn">Close & Return to Map</button>
        </div>
    </div>

    <!-- Generic Info Modal for About & Attributions -->
    <div class="modal-overlay" id="infoModal">
        <div class="feedback-window">
            <div class="modal-header">
                <h3 id="infoModalTitle">Info</h3>
                <button class="modal-close-btn" id="closeInfoBtn" aria-label="Close info"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="infoModalBody" class="info-modal-body">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="oc_map"></div>

    <!-- Bottom Right Geolocation Floating Button -->
    <button class="my-location-btn" id="myLocationBtn" aria-label="Go to my location" title="Go to my location">
        <i class="fa-solid fa-crosshairs"></i>
    </button>

    <!-- Google Maps Style Swipeable Bottom Sheet 1 -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <!-- Drag Handle Area -->
        <div class="sheet-drag-area" id="sheetDragArea">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h3 id="sheetTitle">Building Title</h3>
            </div>
            <!-- Prominent Action Button -->
            <button class="destination-btn" id="goToDestinationBtn">
                <i class="fa-solid fa-location-arrow"></i> Go to Destination
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="sheet-content" id="sheetContent">
            <!-- 3 Images Carousel / Grid Row -->
            <div class="sheet-images-gallery" id="sheetImagesGallery">
                <div class="sheet-image-box">
                    <div class="sheet-placeholder-text">
                        <i class="fa-solid fa-image"></i>
                        <span>Photo 1</span>
                    </div>
                    <img id="sheetImage1" src="" alt="Building Photo 1">
                </div>
                <div class="sheet-image-box">
                    <div class="sheet-placeholder-text">
                        <i class="fa-solid fa-image"></i>
                        <span>Photo 2</span>
                    </div>
                    <img id="sheetImage2" src="" alt="Building Photo 2">
                </div>
                <div class="sheet-image-box">
                    <div class="sheet-placeholder-text">
                        <i class="fa-solid fa-image"></i>
                        <span>Photo 3</span>
                    </div>
                    <img id="sheetImage3" src="" alt="Building Photo 3">
                </div>
            </div>

            <p class="sheet-description" id="sheetDescription">
                Building description text goes here...
            </p>
        </div>
    </div>

    <script>
        // Initialize Map with Rotation Support & Compass hidden at 0° bearing
        var oc_map = L.map('oc_map', {
            zoomControl: false,
            rotate: true,

            minZoom: 0,
            maxZoom: 20,
            attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="http://openstreetmap.org">OpenStreetMap</a> contributors'
        });

        light_map.addTo(oc_map);
        var currentTileLayer = light_map;
        var searchMarker = null;
        let userMarker = null;
        let accuracyCircle = null;

        // --- Dynamic Swipeable Bottom Sheet Logic ---
        const bottomSheet = document.getElementById('bottomSheet');
        const bottomSheetOverlay = document.getElementById('bottomSheetOverlay');
        const sheetDragArea = document.getElementById('sheetDragArea');
        const sheetContent = document.getElementById('sheetContent');
        const goToDestinationBtn = document.getElementById('goToDestinationBtn');
        const sheetTitle = document.getElementById('sheetTitle');
        const sheetDescription = document.getElementById('sheetDescription');

        const sheetImgElements = [
            document.getElementById('sheetImage1'),
            document.getElementById('sheetImage2'),
            document.getElementById('sheetImage3')
        ];

        let activeDestinationCoords = null;
        let currentSnapState = 'closed';
        let startY = 0;
        let currentY = 0;
        let initialTransformY = 0;
        let isDragging = false;

        const PEEK_HEIGHT = 160;

        function getPeekOffsetY() {
            return window.innerHeight - PEEK_HEIGHT;
        }

        function snapToState(state) {
            currentSnapState = state;
            bottomSheet.classList.remove('dragging');
            bottomSheet.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';

            if (state === 'expanded') {
                bottomSheet.style.transform = 'translateY(0px)';
                bottomSheetOverlay.classList.add('active');
            } else if (state === 'peek') {
                const peekOffset = getPeekOffsetY();
                bottomSheet.style.transform = `translateY(${peekOffset}px)`;
                bottomSheetOverlay.classList.remove('active');
            } else {
                bottomSheet.style.transform = 'translateY(100%)';
                bottomSheetOverlay.classList.remove('active');
            }
        }

        function openBottomSheet(data) {
            sheetTitle.textContent = data.title || "Location Details";
            sheetDescription.textContent = data.description || "No description available.";
            activeDestinationCoords = data.coords || null;

            const imageUrls = Array.isArray(data.imageUrls) ? data.imageUrls : (data.imageUrl ? [data.imageUrl] : []);

            sheetImgElements.forEach((imgEl, idx) => {
                const box = imgEl.parentElement;
                const placeholder = box.querySelector('.sheet-placeholder-text');

                if (imageUrls[idx]) {
                    imgEl.src = imageUrls[idx];
                    imgEl.style.display = 'block';
                    if (placeholder) placeholder.style.display = 'none';
                } else {
                    imgEl.src = '';
                    imgEl.style.display = 'none';
                    if (placeholder) placeholder.style.display = 'flex';
                }
            });

            snapToState('peek');
        }

        function closeBottomSheet() {
            snapToState('closed');
        }

        function onTouchStart(e) {
            if (e.target.closest('#sheetDragArea') || sheetContent.scrollTop === 0) {
                isDragging = true;
                startY = e.touches[0].clientY;
                
                if (currentSnapState === 'expanded') {
                    initialTransformY = 0;
                } else if (currentSnapState === 'peek') {
                    initialTransformY = getPeekOffsetY();
                } else {
                    initialTransformY = window.innerHeight;
                }

                bottomSheet.classList.add('dragging');
                bottomSheet.style.transition = 'none';
            }
        }

        function onTouchMove(e) {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            let newTransformY = initialTransformY + deltaY;

            if (newTransformY < 0) newTransformY = 0;

            bottomSheet.style.transform = `translateY(${newTransformY}px)`;
        }

        function onTouchEnd(e) {
            if (!isDragging) return;
            isDragging = false;

            const deltaY = currentY - startY;
            const peekOffset = getPeekOffsetY();

            if (currentSnapState === 'peek') {
                if (deltaY < -60) {
                    snapToState('expanded');
                } else if (deltaY > 60) {
                    snapToState('closed');
                } else {
                    snapToState('peek');
                }
            } else if (currentSnapState === 'expanded') {
                if (deltaY > 120) {
                    snapToState('closed');
                } else if (deltaY > 50) {
                    snapToState('peek');
                } else {
                    snapToState('expanded');
                }
            } else {
                if (deltaY < -100) {
                    snapToState('peek');
                } else {
                    snapToState('closed');
                }
            }
        }

        bottomSheet.addEventListener('touchstart', onTouchStart, { passive: true });
        bottomSheet.addEventListener('touchmove', onTouchMove, { passive: true });
        bottomSheet.addEventListener('touchend', onTouchEnd);

        bottomSheetOverlay.addEventListener('click', closeBottomSheet);

        };

        L.geoJSON(geojsonData, {
            style: function (feature) {
                if (feature.properties.perimeter) {
                    return { color: "#d9534f", weight: 3, dashArray: "5, 5", fill: false };
                } else if (feature.properties.GYMNASIUM) {
                    return { color: "#ff7800", weight: 1.5, fillColor: "#ff7800", fillOpacity: 0.25 };
                } else if (feature.properties.DPRO) {
                    return { color: "#d9534f", weight: 1.5, fillColor: "#d9534f", fillOpacity: 0.25 };
                }
                return { color: "#0B793D", weight: 1.5, fillColor: "#0B793D", fillOpacity: 0.2 };
            },
            onEachFeature: function (feature, layer) {
                if (feature.properties.perimeter) return;

                let center = null;
                try {
                    center = layer.getBounds().getCenter();
                } catch (e) {
                    console.warn("Invalid bounds for feature.");
                }

                let propKey = Object.keys(feature.properties)[0];
                let buildingName = propKey ? propKey : "Campus Location";
                let buildingId = feature.properties[propKey] || "";

                const handleBuildingClick = () => {
                    if (buildingId === "OC_DPRO") {
                        openBottomSheet({
                            title: "DPRO Building",
                            description: "Olivarez College DPRO facility. Department offices and official functions.",
                            imageUrls: [],
                            coords: center
                        });
                    } else {
                        openBottomSheet({
                            title: buildingName,
                            description: `Building ID: ${buildingId}`,
                            imageUrls: [],
                            coords: center
                        });
                    }
                };

                layer.on('click', handleBuildingClick);

                if (center) {
                    let iconClass = "fa-solid fa-building";
                    let iconColor = "#0B793D";
                    
                    if (buildingName.includes("GYM")) {
                        iconClass = "fa-solid fa-dumbbell";
                        iconColor = "#ff7800";
                    } else if (buildingName.includes("HOSPITAL") || buildingName.includes("EYE CENTER") || buildingName.includes("CLINIC")) {
                        iconClass = "fa-solid fa-hospital";
                        iconColor = "#d9534f";
                    } else if (buildingName.includes("PARKING")) {
                        iconClass = "fa-solid fa-square-parking";
                        iconColor = "#2196F3";
                    } else if (buildingId === "OC_DPRO") {
                        iconClass = "fa-solid fa-landmark";
                        iconColor = "#d9534f";
                    }

                    const customIcon = L.divIcon({
                        className: 'custom-map-icon',
                        html: `<div style="background-color: white; padding: 6px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); text-align: center; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;">
                                   <i class="${iconClass}" style="color: ${iconColor}; font-size: 14px;"></i>
                               </div>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const marker = L.marker(center, { icon: customIcon }).addTo(oc_map);
                    marker.on('click', handleBuildingClick);
                }
            }
        }).addTo(oc_map);

        // --- Inverted Polygon Mask Overlay (Dimming Outside Area) ---
        let maskPolygon = null;
        const perimeterFeature = geojsonData.features.find(f => f.properties && f.properties.perimeter);

        if (perimeterFeature) {
            const perimeterLatLngs = perimeterFeature.geometry.coordinates.map(coord => [coord[1], coord[0]]);

            const worldOuterBounds = [
                [90, -180],
                [90, 180],
                [-90, 180],
                [-90, -180]
            ];

            maskPolygon = L.polygon([worldOuterBounds, perimeterLatLngs], {
                color: 'transparent',
                fillColor: '#111827',
                fillOpacity: 0.45,
                interactive: false
            }).addTo(oc_map);
        }

        // Drawer Menu Toggle
        const menuToggle = document.getElementById('menuToggle');
        const closeDrawer = document.getElementById('closeDrawer');
        const sideDrawer = document.getElementById('sideDrawer');
        const navOverlay = document.getElementById('navOverlay');

        function openMenu() {
            sideDrawer.classList.add('active');
            navOverlay.classList.add('active');
        }

        function closeMenu() {
            sideDrawer.classList.remove('active');
            navOverlay.classList.remove('active');
        }

        menuToggle.addEventListener('click', openMenu);
        closeDrawer.addEventListener('click', closeMenu);
        navOverlay.addEventListener('click', closeMenu);

        // Modal Controls
        const feedbackLink = document.getElementById('feedbackLink');
        const feedbackModal = document.getElementById('feedbackModal');
        const closeFeedbackBtn = document.getElementById('closeFeedbackBtn');
        const sendFeedbackBtn = document.getElementById('sendFeedbackBtn');
        const feedbackForm = document.getElementById('feedbackForm');
        const successModal = document.getElementById('successModal');
        const closeSuccessBtn = document.getElementById('closeSuccessBtn');

        feedbackLink.addEventListener('click', (e) => {
            e.preventDefault();
            closeMenu();
            feedbackModal.classList.add('active');
        });

        closeFeedbackBtn.addEventListener('click', () => {
            feedbackModal.classList.remove('active');
        });

        // EmailJS Submission
        feedbackForm.addEventListener('submit', (e) => {
            e.preventDefault();

            sendFeedbackBtn.disabled = true;
            sendFeedbackBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Sending...`;

            const email = document.getElementById('userEmail').value;
            const subject = document.getElementById('feedbackSubject').value;
            const message = document.getElementById('feedbackMessage').value;

            const templateParams = {
                name: email,
                email: email,
                subject: subject,
                message: message
            };

            emailjs.send('service_wdyvki8', 'template_86k881g', templateParams)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                    feedbackModal.classList.remove('active');
                    successModal.classList.add('active');
                    feedbackForm.reset();
                }, function(error) {
                    console.error('FAILED...', error);
                    alert('Failed to send feedback automatically. Opening email client instead...');
                    
                    const recipientEmail = "dwightjustin.reyes@olivarezcollege.edu.ph";
                    window.location.href = `mailto:${recipientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent("From: " + email + "\n\n" + message)}`;
                    feedbackModal.classList.remove('active');
                })
                .finally(function() {
                    sendFeedbackBtn.disabled = false;
                    sendFeedbackBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Send Feedback`;
                });
        });

        closeSuccessBtn.addEventListener('click', () => {
            successModal.classList.remove('active');
        });

        // Light / Dark Theme Logic
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        let isDarkMode = false;

        themeToggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isDarkMode = !isDarkMode;

            if (isDarkMode) {
                oc_map.removeLayer(currentTileLayer);
                dark_map.addTo(oc_map);
                currentTileLayer = dark_map;
                
                document.body.classList.add('dark-theme');
                themeIcon.className = 'fa-solid fa-sun';
                themeLabel.textContent = 'Light Mode';

                if (maskPolygon) {
                    maskPolygon.setStyle({
                        fillColor: '#000000',
                        fillOpacity: 0.65
                    });
                }
            } else {
                oc_map.removeLayer(currentTileLayer);
                light_map.addTo(oc_map);
                currentTileLayer = light_map;

                document.body.classList.remove('dark-theme');
                themeIcon.className = 'fa-solid fa-moon';
                themeLabel.textContent = 'Dark Mode';

                if (maskPolygon) {
                    maskPolygon.setStyle({
                        fillColor: '#111827',
                        fillOpacity: 0.45
                    });
                }
            }
            closeMenu();
        });

        // Location Search
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        oc_map.setView([lat, lon], 16);

                        if (searchMarker) {
                            oc_map.removeLayer(searchMarker);
                        }

                        searchMarker = L.marker([lat, lon]).addTo(oc_map)
                            .bindPopup(`<b>${data[0].display_name}</b>`)
                            .openPopup();
                    } else {
                        alert('Location not found. Please try another search term.');
                    }
                })
                .catch(err => {
                    console.error('Search error:', err);
                    alert('Error searching for location.');
                });
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Geolocation Logic
        function locateUser() {
            if (!('geolocation' in navigator)) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    if (userMarker) oc_map.removeLayer(userMarker);
                    if (accuracyCircle) oc_map.removeLayer(accuracyCircle);

                    accuracyCircle = L.circle([lat, lng], {
                        radius: accuracy,
                        color: '#0B793D',
                        fillColor: '#0B793D',
                        fillOpacity: 0.15
                    }).addTo(oc_map);

                    userMarker = L.marker([lat, lng]).addTo(oc_map)
                        .bindPopup("You are here!")
                        .openPopup();

                    oc_map.flyTo([lat, lng], 18, { animate: true, duration: 1.5 });
                },
                (error) => {
                    console.warn("Geolocation Error:", error);
                    if (error.code === error.POSITION_UNAVAILABLE) {
                        alert("Device location is turned off. Please turn on Location/GPS in your phone's settings and try again.");
                    } else if (error.code === error.PERMISSION_DENIED) {
                        alert("Location access was denied in your browser settings.");
                    } else {
                        alert("Unable to acquire location signal.");
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        document.getElementById('myLocationBtn').addEventListener('click', locateUser);

        // About & Attributions Modals
        const infoModal = document.getElementById('infoModal');
        const infoModalTitle = document.getElementById('infoModalTitle');
        const infoModalBody = document.getElementById('infoModalBody');
        const closeInfoBtn = document.getElementById('closeInfoBtn');

        document.getElementById('aboutLink').addEventListener('click', (e) => {
            e.preventDefault();
            closeMenu();
            infoModalTitle.innerHTML = `<i class="fa-solid fa-circle-info"></i> About Us / Contact Us`;
            infoModalBody.innerHTML = `
                <p style="margin-bottom:10px;"><strong>OCNP Mobile Navigation</strong></p>
                <p style="margin-bottom:10px;">Providing accurate interactive location mapping and mobile map interfaces.</p>
                <p><strong>Contact:</strong> <br><a href="mailto:dwightjustin.reyes@olivarezcollege.edu.ph" class="break-email">dwightjustin.reyes@olivarezcollege.edu.ph</a></p>
            `;
            infoModal.classList.add('active');
        });

        document.getElementById('attributionsLink').addEventListener('click', (e) => {
            e.preventDefault();
            closeMenu();
            infoModalTitle.innerHTML = `<i class="fa-solid fa-users"></i> Attributions`;
            infoModalBody.innerHTML = `
                <ul class="info-list">
                    <li><i class="fa-solid fa-map"></i> <span>Maps &copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors</span></li>
                    <li><i class="fa-solid fa-code"></i> <span>Leaflet JS Engine</span></li>
                    <li><i class="fa-solid fa-compass"></i> <span>Leaflet Rotate Plugin by Grzegorz Tomicki</span></li>
                    <li><i class="fa-solid fa-icons"></i> <span>Icons by FontAwesome</span></li>
                </ul>
            `;
            infoModal.classList.add('active');
        });

        closeInfoBtn.addEventListener('click', () => {
            infoModal.classList.remove('active');
        });
    </script>
